# Template-Based Test Scenarios
# 모든 테스트 케이스를 템플릿으로 정의하여 재사용 가능하고 관리하기 쉬운 테스트 시나리오 구성

test_templates:
  # =================
  # 기본 CRUD 템플릿
  # =================
  
  # 1. 테이블 관련 템플릿
  get_table:
    identifier: "test-get-table"
    name: "Get Table Information"
    description: "테이블 기본 정보 조회 테스트"
    query: |
      query GetTable($tableId: ID!) {
        table(id: $tableId) {
          id
          identifier
          description
          nodeCount
          attributeCount
          createdAt
          updatedAt
        }
      }
    variables:
      tableId: "1"
    expectations:
      - path: "data.table.id"
        type: "string"
      - path: "data.table.nodeCount"
        type: "number"
        
  list_tables:
    identifier: "test-list-tables"
    name: "List All Tables"
    description: "모든 테이블 목록 조회 테스트"
    query: |
      query ListTables($first: Int, $after: String) {
        tables(first: $first, after: $after) {
          nodes {
            id
            identifier
            description
            nodeCount
          }
          totalCount
          hasNextPage
          hasPreviousPage
        }
      }
    variables:
      first: 10
    expectations:
      - path: "data.tables.nodes"
        type: "array"
      - path: "data.tables.totalCount"
        type: "number"

  create_table:
    identifier: "test-create-table"
    name: "Create New Table"
    description: "새 테이블 생성 테스트"
    query: |
      mutation CreateTable($input: CreateTableInput!) {
        createTable(input: $input) {
          id
          identifier
          description
          createdAt
        }
      }
    variables:
      input:
        identifier: "test-table-{{timestamp}}"
        description: "Test table created by template"
    expectations:
      - path: "data.createTable.id"
        type: "string"
      - path: "data.createTable.identifier"
        contains: "test-table"

  # 2. 속성 관련 템플릿
  define_attributes:
    identifier: "test-define-attributes"
    name: "Define Table Attributes"
    description: "테이블에 속성 정의 테스트"
    query: |
      mutation DefineAttributes($tableId: ID!, $attributes: [AttributeInput!]!) {
        defineAttributes(tableId: $tableId, attributes: $attributes) {
          id
          name
          type
          required
          tableId
        }
      }
    variables:
      tableId: "{{tableId}}"
      attributes:
        - name: "name"
          type: "string"
          required: true
        - name: "email"
          type: "string"
          required: true
        - name: "age"
          type: "integer"
          required: false
    expectations:
      - path: "data.defineAttributes"
        type: "array"
      - path: "data.defineAttributes.length"
        equals: 3

  create_node_with_attributes:
    identifier: "test-create-node-with-attributes"
    name: "Create Node with Attributes"
    description: "속성을 포함한 노드 생성 테스트"
    query: |
      mutation CreateNodeWithAttributes($tableId: ID!, $attributes: JSON!) {
        createNodeWithAttributes(tableId: $tableId, attributes: $attributes) {
          id
          tableId
          attributes
          createdAt
        }
      }
    variables:
      tableId: "{{tableId}}"
      attributes:
        name: "John Doe"
        email: "john.doe@example.com"
        age: 30
    expectations:
      - path: "data.createNodeWithAttributes.id"
        type: "string"
      - path: "data.createNodeWithAttributes.attributes.name"
        equals: "John Doe"

  get_node_with_attributes:
    identifier: "test-get-node-with-attributes"
    name: "Get Node with Attributes"
    description: "속성을 포함한 노드 조회 테스트"
    query: |
      query GetNodeWithAttributes($nodeId: ID!) {
        getNodeWithAttributes(nodeId: $nodeId) {
          id
          tableId
          attributes
          createdAt
          updatedAt
        }
      }
    variables:
      nodeId: "{{nodeId}}"
    expectations:
      - path: "data.getNodeWithAttributes.id"
        type: "string"
      - path: "data.getNodeWithAttributes.attributes"
        type: "object"

  delete_node:
    identifier: "test-delete-node"
    name: "Delete Node"
    description: "노드 삭제 테스트"
    query: |
      mutation DeleteNode($nodeId: ID!) {
        deleteNode(nodeId: $nodeId) {
          success
          message
        }
      }
    variables:
      nodeId: "{{nodeId}}"
    expectations:
      - path: "data.deleteNode.success"
        equals: true

  # 4. 노드 관련 템플릿
  get_node:
    identifier: "test-get-node"
    name: "Get Node Information"
    description: "노드 기본 정보 조회 테스트"
    query: |
      query GetNode($nodeId: ID!) {
        node(id: $nodeId) {
          id
          content
          title
          description
          tableId
          createdAt
          updatedAt
        }
      }
    variables:
      nodeId: "1"
    expectations:
      - path: "data.node.id"
        type: "string"
      - path: "data.node.content"
        type: "string"

  create_node:
    identifier: "test-create-node"
    name: "Create New Node"
    description: "새 노드 생성 테스트"
    query: |
      mutation CreateNode($input: CreateNodeInput!) {
        createNode(input: $input) {
          id
          content
          title
          description
          tableId
          createdAt
        }
      }
    variables:
      input:
        tableId: "1"
        content: "Test node content"
        title: "Test Node"
        description: "Node created by template test"
    expectations:
      - path: "data.createNode.id"
        type: "string"
      - path: "data.createNode.content"
        equals: "Test node content"

  search_nodes:
    identifier: "test-search-nodes"
    name: "Search Nodes"
    description: "노드 검색 기능 테스트"
    query: |
      query SearchNodes($tableId: ID!, $pagination: TablesPagination) {
        nodes(tableId: $tableId, pagination: $pagination) {
          nodes {
            id
            content
            title
            description
            createdAt
          }
          totalCount
          hasNextPage
          hasPreviousPage
        }
      }
    variables:
      tableId: "1"
      pagination:
        limit: 10
        offset: 0
    expectations:
      - path: "data.nodes.nodes"
        type: "array"
      - path: "data.nodes.totalCount"
        type: "number"
      - path: "data.nodes.hasNextPage"
        type: "boolean"

  # 3. 속성 관련 템플릿
  get_node_attributes:
    identifier: "test-get-node-attributes"
    name: "Get Node Attributes"
    description: "노드 속성 조회 테스트"
    query: |
      query GetNodeAttributes($nodeId: ID!) {
        node(id: $nodeId) {
          id
          attributes {
            id
            name
            value
            type
            description
          }
        }
      }
    variables:
      nodeId: "1"
    expectations:
      - path: "data.node.attributes"
        type: "array"

  set_node_attribute:
    identifier: "test-set-node-attribute"
    name: "Set Node Attribute"
    description: "노드 속성 설정 테스트"
    query: |
      mutation SetNodeAttribute($input: SetNodeAttributeInput!) {
        setNodeAttribute(input: $input) {
          id
          value
          type
        }
      }
    variables:
      input:
        nodeId: "1"
        attributeId: "1"
        value: "Test attribute value"
    expectations:
      - path: "data.setNodeAttribute.id"
        type: "string"
      - path: "data.setNodeAttribute.value"
        equals: "Test attribute value"

  # =================
  # 관계 및 그래프 템플릿  
  # =================

  get_node_relations:
    identifier: "test-get-node-relations"
    name: "Get Node Relations"
    description: "노드 관계 조회 테스트"
    query: |
      query GetNodeRelations($nodeId: ID!) {
        node(id: $nodeId) {
          id
          content
          outgoingRelations {
            id
            targetNode {
              id
              content
            }
            relationType {
              id
              identifier
            }
            strength
            confidence
          }
          incomingRelations {
            id
            sourceNode {
              id
              content
            }
            relationType {
              id
              identifier
            }
            strength
            confidence
          }
        }
      }
    variables:
      nodeId: "1"
    expectations:
      - path: "data.node.id"
        type: "string"
      - path: "data.node.outgoingRelations"
        type: "array"
      - path: "data.node.incomingRelations"
        type: "array"

  create_relation:
    identifier: "test-create-relation"
    name: "Create Node Relation"
    description: "노드 관계 생성 테스트"
    query: |
      mutation CreateRelation($input: CreateRelationInput!) {
        createRelation(input: $input) {
          id
          sourceId
          targetId
          strength
          confidence
          type
        }
      }
    variables:
      input:
        sourceId: "1"
        targetId: "2"
        strength: 0.8
        confidence: 0.9
        type: "RELATED"
    expectations:
      - path: "data.createRelation.id"
        type: "string"
      - path: "data.createRelation.strength"
        equals: 0.8

  # =================
  # 복합 시나리오 템플릿
  # =================

  health_check:
    identifier: "test-health-check"
    name: "System Health Check"
    description: "시스템 상태 확인 테스트"
    query: |
      query HealthCheck {
        health {
          status
          timestamp
          database
          version
        }
      }
    variables: {}
    expectations:
      - path: "data.health.status"
        equals: "ok"
      - path: "data.health.database"
        type: "string"

  full_table_info:
    identifier: "test-full-table-info"
    name: "Complete Table Information"
    description: "테이블의 모든 정보 조회 테스트"
    query: |
      query FullTableInfo($tableId: ID!) {
        table(id: $tableId) {
          id
          identifier
          description
          nodeCount
          attributeCount
          nodes(first: 5) {
            nodes {
              id
              content
              title
              attributes {
                id
                name
                value
              }
            }
            totalCount
          }
          attributes {
            id
            name
            type
            description
          }
        }
      }
    variables:
      tableId: "1"
    expectations:
      - path: "data.table.id"
        type: "string"
      - path: "data.table.nodes.nodes"
        type: "array"
      - path: "data.table.attributes"
        type: "array"

# =================
# 테스트 시나리오 그룹
# =================

test_scenarios:
  basic_crud:
    name: "기본 CRUD 테스트"
    description: "기본적인 생성, 조회, 수정, 삭제 기능 테스트"
    templates:
      - get_table
      - list_tables
      - create_table
      - get_node
      - create_node
      - search_nodes
    setup:
      - ensure_test_table_exists
    teardown:
      - cleanup_test_tables

  attribute_management:
    name: "속성 관리 테스트"
    description: "노드 속성 생성, 조회, 수정 기능 테스트"
    templates:
      - get_node_attributes
      - set_node_attribute
    setup:
      - create_test_node_with_attributes
    teardown:
      - cleanup_test_nodes

  relationship_operations:
    name: "관계 관리 테스트"
    description: "노드 간 관계 생성 및 조회 기능 테스트"
    templates:
      - get_node_relations
      - create_relation
    setup:
      - create_test_nodes_for_relations
    teardown:
      - cleanup_test_relations

  system_integration:
    name: "시스템 통합 테스트"
    description: "시스템 전체 기능의 통합적 동작 테스트"
    templates:
      - health_check
      - full_table_info
    setup:
      - prepare_full_test_environment
    teardown:
      - cleanup_all_test_data

  performance_baseline:
    name: "성능 기준선 테스트"
    description: "기본적인 성능 지표 측정 테스트"
    templates:
      - list_tables
      - search_nodes
      - get_node_relations
    performance_expectations:
      execution_time: "< 200ms"
      memory_usage: "< 50MB"
      complexity_score: "< 5"

# =================
# 테스트 실행 설정
# =================

execution_settings:
  server_url: "http://localhost:4000/graphql"
  timeout: 5000
  retries: 3
  parallel_execution: false
  cleanup_after_test: true
  collect_performance_metrics: true
  
variable_substitution:
  timestamp: "{{new Date().getTime()}}"
  random_id: "{{Math.random().toString(36).substr(2, 9)}}"
  test_prefix: "template-test"