overwrite: true
schema: "src/presentation/graphql/schema/**/*.graphql"
documents: null
generates:
  generated/graphql.types.ts:
    plugins:
      - "typescript"
    config:
      scalars:
        DateTime: string
        JSON: any
      enumsAsTypes: true
      skipTypename: false
      avoidOptionals: false
      maybeValue: "T | null | undefined"
      
  generated/schema.json:
    plugins:
      - "introspection"
    config:
      minify: false