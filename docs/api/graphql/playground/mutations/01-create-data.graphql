# ===================================================================
# ✏️ Create Data - 기본 데이터 생성 연산
# ===================================================================
# 목적: 테이블, 노드, 관계를 생성하여 테스트 환경을 구축합니다.
# 난이도: ⭐⭐ (기본)
# 전제조건: 시스템이 정상 작동 중 (health check 통과)
# ===================================================================

# 1. 테이블 생성 - 사용자 정보를 저장할 테이블
mutation CreateUserTable {
  createTable(input: {
    identifier: "users_table"
    name: "사용자 테이블"
    description: "시스템 사용자 정보를 관리하는 테이블"
    attributeTypes: [
      {
        name: "email"
        dataType: STRING
        isRequired: true
        validation: {
          pattern: "^[\\w-\\.]+@([\\w-]+\\.)+[\\w-]{2,4}$"
          maxLength: 100
        }
      }
      {
        name: "age"
        dataType: NUMBER
        isRequired: false
        defaultValue: "0"
        validation: {
          min: 0
          max: 150
        }
      }
      {
        name: "role"
        dataType: STRING
        isRequired: false
        defaultValue: "user"
        validation: {
          enum: ["user", "admin", "manager"]
        }
      }
    ]
  }) {
    success
    table {
      id
      identifier
      name
      description
      createdAt
      
      # 생성된 속성 타입들
      attributeTypes {
        id
        name
        dataType
        isRequired
        defaultValue
        validation
      }
    }
    errors {
      message
      code
      field
    }
  }
}

# ===================================================================
# 📋 Variables for Node Creation (노드 생성용 변수)
# ===================================================================
# 위 테이블 생성 후 반환된 tableId를 사용하세요:
# {
#   "tableId": "table_123",
#   "userData": {
#     "tableId": "table_123",
#     "content": "김철수 사용자 프로필",
#     "attributes": [
#       {
#         "name": "email",
#         "value": "kimcs@example.com"
#       },
#       {
#         "name": "age",
#         "value": "28"
#       },
#       {
#         "name": "role",
#         "value": "manager"
#       }
#     ]
#   }
# }

# 2. 노드 생성 - 사용자 데이터 추가
mutation CreateUser($userData: CreateNodeInput!) {
  createNode(input: $userData) {
    success
    node {
      id
      content
      createdAt
      
      # 테이블 정보
      table {
        id
        name
        identifier
      }
      
      # 생성된 속성들
      attributes {
        id
        name
        value
        type {
          name
          dataType
          validation
        }
      }
    }
    errors {
      message
      code
      field
    }
  }
}

# 3. 여러 노드를 한번에 생성 - 대량 데이터 처리
mutation CreateMultipleUsers($tableId: ID!) {
  bulkCreateNodes(input: {
    tableId: $tableId
    nodes: [
      {
        content: "박영희 사용자"
        attributes: [
          { name: "email", value: "park@example.com" }
          { name: "age", value: "25" }
          { name: "role", value: "user" }
        ]
      }
      {
        content: "이민수 관리자"
        attributes: [
          { name: "email", value: "lee@example.com" }
          { name: "age", value: "35" }
          { name: "role", value: "admin" }
        ]
      }
      {
        content: "정지훈 사용자"
        attributes: [
          { name: "email", value: "jung@example.com" }
          { name: "age", value: "30" }
        ]
      }
    ]
  }) {
    success
    createdCount
    failedCount
    
    # 생성된 노드들
    nodes {
      id
      content
      attributes {
        name
        value
      }
    }
    
    # 개별 처리 결과
    results {
      success
      nodeId
      error {
        message
        code
      }
    }
    
    errors {
      message
      code
    }
  }
}

# ===================================================================
# 📋 Variables for Relations (관계 생성용 변수)
# ===================================================================
# 위에서 생성된 노드 ID들을 사용하여 관계를 설정하세요:
# {
#   "sourceNodeId": "node_123",
#   "targetNodeId": "node_456",
#   "relationInput": {
#     "sourceNodeId": "node_123",
#     "targetNodeId": "node_456",
#     "relationTypeId": "default_relation_type",
#     "strength": 0.8,
#     "confidence": 0.9,
#     "description": "관리 관계"
#   }
# }

# 4. 관계 생성 - 노드들 간의 연결
mutation CreateRelation($relationInput: CreateRelationInput!) {
  createRelation(input: $relationInput) {
    success
    relation {
      id
      strength
      confidence
      description
      createdAt
      
      # 관계 타입
      type {
        id
        name
        description
      }
      
      # 연결된 노드들
      sourceNode {
        id
        content
        attributes {
          name
          value
        }
      }
      targetNode {
        id
        content
        attributes {
          name
          value
        }
      }
    }
    errors {
      message
      code
      field
    }
  }
}

# 5. 속성이 있는 노드와 관계를 동시에 생성
mutation CreateNodeWithRelations {
  createNode(input: {
    tableId: "users_table"
    content: "홍길동 팀장"
    attributes: [
      { name: "email", value: "hong@example.com" }
      { name: "age", value: "40" }
      { name: "role", value: "manager" }
    ]
  }) {
    success
    node {
      id
      content
      
      # 생성 후 이 ID를 사용해서 관계를 생성할 수 있음
      attributes {
        name
        value
      }
    }
  }
}

