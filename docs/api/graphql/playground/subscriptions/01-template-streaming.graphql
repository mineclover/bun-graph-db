# ===================================================================
# 🔥 Template Streaming - 실시간 템플릿 실행 (NEW!)
# ===================================================================
# 목적: 쿼리 템플릿을 실시간 스트리밍으로 실행합니다.
# 난이도: ⭐⭐⭐ (고급) - 최신 기능!
# 연결: WebSocket 필요
# ===================================================================

# 1. 기본 템플릿 스트리밍 실행
subscription BasicTemplateStreaming {
  executeTemplateStream(
    templateIdentifier: "basic-user-query"
    trackUsage: true
  ) {
    status        # STARTING → IN_PROGRESS → COMPLETED
    data          # 실행 결과 (완료 시)
    progress      # 0.0 ~ 1.0 진행률
    timestamp     # 이벤트 발생 시간
    error         # 에러 메시지 (에러 발생 시)
    
    metadata {
      templateId
      templateName
      complexityScore
      executionTime    # 현재까지 실행 시간 (ms)
    }
  }
}

# ===================================================================
# 📋 Variables for Template Streaming (템플릿 스트리밍용 변수)
# ===================================================================
# Playground 하단 Variables 섹션에 붙여넣으세요:
# {
#   "templateIdentifier": "user-analytics-live",
#   "variables": {
#     "tableId": "users_table",
#     "timeWindow": "1h",
#     "limit": 100
#   }
# }

# 2. 변수가 있는 고급 템플릿 스트리밍
subscription AdvancedTemplateStreaming($templateId: String!, $variables: JSON) {
  executeTemplateStream(
    templateIdentifier: $templateId
    variables: $variables
    trackUsage: true
  ) {
    status
    data
    progress
    timestamp
    error
    
    metadata {
      templateId
      templateName
      complexityScore
      estimatedTokens
      version
      executionTime
    }
  }
}

