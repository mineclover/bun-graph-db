# ===================================================================
# 🚨 Error Handling (에러 처리)
# ===================================================================

# 3. 에러 상황 테스트용 쿼리
subscription TestErrorHandling {
  executeTemplateStream(
    templateIdentifier: "non-existent-template"
  ) {
    status
    data
    error         # 에러 메시지
    
    metadata {
      templateName
      executionTime
    }
  }
}

