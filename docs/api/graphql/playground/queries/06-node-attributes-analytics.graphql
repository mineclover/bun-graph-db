# - node_attributes: 정규화된 속성 저장 (16개 레코드)
# - attributes: 속성 정의 및 메타데이터 (15개 레코드)
# - attribute_types: 타입 시스템 (25개 타입 정의)
# - nodes: 노드와 속성의 관계 (64개 노드)

# ✅ 새로 활용된 필드들:
# - attribute_types.json_type: 타입 검증
# - attribute_types.format: 형식 검증
# - attributes.is_required: 필수 속성 관리
# - node_attributes.*: 정규화된 저장소

# ✅ 성능 이점:
# - 인덱싱된 검색 (node_attributes 테이블)
