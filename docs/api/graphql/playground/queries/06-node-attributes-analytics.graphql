# ===================================================================
# 📊 Node Attributes Analytics - Normalized Schema Utilization
# ===================================================================
# 목적: 정규화된 node_attributes 테이블의 완전한 활용을 보여줍니다.
# 난이도: ⭐⭐⭐ (고급)
# 스키마 활용도: 100% (node_attributes, attributes, attribute_types 완전 활용)
# ===================================================================

# 1. 전체 속성 분석 - 정규화된 스키마의 강력함 시연
query ComprehensiveAttributeAnalytics {
  nodeAttributeAnalytics {
    totalNodes
    totalAttributes
    completenessPercentage

    # 속성별 상세 통계 - attribute_types 테이블 활용
    attributeStats {
      attributeId
      identifier
      totalValues
      uniqueValues
      nullValues
      completenessRate
      dataType  # attribute_types.json_type에서 가져옴
    }

    # 타입별 분포 - 정규화의 이점
    typeDistribution {
      typeId
      identifier
      jsonType
      usageCount
      averageValuesPerNode
    }
  }
}

