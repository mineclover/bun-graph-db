# 2. 특정 테이블의 속성 완성도 분석 - is_required 필드 활용
query AttributeCompleteness($performanceTableId: ID!) {
  attributeCompleteness(tableId: $performanceTableId) {
    tableId
    totalNodes
    totalRequiredAttributes
    totalOptionalAttributes
    completeNodes
    incompleteNodes
    completenessRate

    # 속성별 완성도 - normalized storage의 이점
    attributeCompleteness {
      attributeId
      identifier
      isRequired
      filledCount
      emptyCount
      completenessRate
    }
  }
}

# 3. 속성 값 분포 분석 - 정규화된 저장소의 검색 성능
query AttributeValueDistribution($attributeId: ID!) {
  attributeValueDistribution(
    attributeId: $attributeId
    groupBy: VALUE
  ) {
    value
    count
    percentage
  }
}

# 4. 속성 기반 노드 검색 - 복잡한 JOIN 쿼리 시연
query SearchByAttributes($searchFilter: NodeAttributeSearchFilter!) {
  searchNodesByAttribute(
    filter: $searchFilter
    pagination: { limit: 10, offset: 0 }
    sort: [{ field: "created_at", direction: DESC }]
  ) {
    nodes {
      id
      content
      table {
        identifier
      }
      # 연관된 속성들 - 정규화의 장점
      attributes {
        id
        name
        value
        type {
          name
          dataType
        }
      }
    }
    totalCount
  }
}

# 5. 타입화된 속성이 있는 노드 - 완전한 스키마 활용
query NodeWithTypedAttributes {
  # Performance node with all typed attributes
  nodeWithTypedAttributes(nodeId: "5") {
    id
    content
    table {
      identifier
      name
    }

    # 타입 검증된 속성들
    typedAttributes {
      id
      attribute {
        identifier
        isRequired
        type {
          identifier
          jsonType
          format
        }
      }
      value
      parsedValue  # JSON 타입에 따라 파싱된 값
      isValid
      validationErrors
    }

    # 누락된 필수 속성들
    missingRequiredAttributes {
      identifier
      description
      isRequired
    }

    completenessScore
  }
}

