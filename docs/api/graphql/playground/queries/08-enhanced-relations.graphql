# ✅ 이전 상태 (미활용):
# - 관계 수: 2개 (전체 64개 노드 대비 3%)
# - strength/confidence: 대부분 기본값
# - external_id: 사용되지 않음
# - properties: JSON 메타데이터 미활용

# ✅ 현재 상태 (완전 활용):
