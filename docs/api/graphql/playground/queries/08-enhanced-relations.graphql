# ===================================================================
# 🔗 Enhanced Relations System - Complete Schema Utilization
# ===================================================================
# 목적: 이전에 활용되지 않던 관계 시스템의 모든 기능을 보여줍니다.
# 난이도: ⭐⭐⭐⭐ (전문가)
# 스키마 활용도: 100% (strength, confidence, external_id, properties 완전 활용)
# ===================================================================

# 1. 관계 분석 개요 - 활성화된 관계 시스템 전체 현황
query RelationSystemOverview {
  relationAnalytics {
    # 기본 통계 - 이제 22개 관계로 증가
    totalRelations
    internalRelations  # internal node-to-node relations
    externalRelations  # external reference relations

    # 관계 타입별 분포 - relation_types 테이블 완전 활용
    relationTypeDistribution {
      relationType {
        identifier
        description
        category  # structural, semantic, hierarchy, reference
      }
      count
      averageStrength    # strength 필드 활용
      averageConfidence  # confidence 필드 활용
      externalReferences # external_id 필드 활용
    }

    # 강도 분포 - strength 필드의 전체 활용
    strengthDistribution {
      invalid        # strength = 0
      autoGenerated  # strength = 1
      uncertain      # strength = 2
      confident      # strength = 3
      veryStrong     # strength = 4
    }

    # 신뢰도 분포 - confidence 필드의 전체 활용
    confidenceDistribution {
      probablyWrong      # confidence = 0
      autoGenerated      # confidence = 1
      uncertainButValid  # confidence = 2
      confident          # confidence = 3
      verified           # confidence = 4
    }

    # 테이블 간 연결성 - 교차 테이블 관계 분석
    tableConnectivity {
      table {
        identifier
        tableNodeCount
      }
      internalConnections
      externalConnections
      averageStrength
      averageConfidence
      mostCommonRelationType {
        identifier
        category
      }
    }

    # 네트워크 메트릭 - 그래프 이론 적용
    networkMetrics {
      density            # 관계 밀도
      clustering         # 클러스터링 계수
      averagePathLength  # 평균 경로 길이
      mostConnectedNodes {
        node {
          id
          content
        }
        connectionCount
        averageStrength
      }
      isolatedNodes      # 고립된 노드 수
    }
  }
}

# ===================================================================
# 📋 Variables for Advanced Relation Queries (고급 관계 쿼리용 변수)
# ===================================================================
# {
#   "sourceNodeId": "5",
#   "targetNodeId": "15",
#   "nodeId": "6",
#   "strengthFilter": {
#     "tableIds": ["6"],
#     "relationTypes": ["relatedTo"],
#     "strengthRange": { "min": 2, "max": 4 },
#     "confidenceRange": { "min": 3, "max": 4 }
#   }
# }

# 2. 최적 경로 찾기 - strength와 confidence를 활용한 pathfinding
query OptimalPathFinding($sourceNodeId: ID!, $targetNodeId: ID!) {
  findOptimalPath(input: {
    sourceNodeId: $sourceNodeId
    targetNodeId: $targetNodeId
    algorithm: WEIGHTED_SHORTEST
    weightingStrategy: STRENGTH_CONFIDENCE  # strength + confidence 가중치
    maxDepth: 5
    preferredRelationTypes: ["relatedTo", "references"]
  }) {
    path {
      node {
        id
        content
        table {
          identifier
        }
      }
      relation {
        id
        strength      # 경로 품질 결정 요소
        confidence    # 경로 신뢰성 결정 요소
        properties    # JSON 메타데이터 활용
        type {
          identifier
          category
        }
      }
      distanceFromSource
      strengthToNext
      confidenceToNext
    }
    totalDistance
    averageStrength    # 경로 전체 강도
    averageConfidence  # 경로 전체 신뢰성
    pathQuality        # EXCELLENT/GOOD/AVERAGE/POOR/UNRELIABLE

    # 대안 경로들 - 다양한 연결 가능성
    alternativePaths {
      path {
        node {
          id
          content
        }
        strengthToNext
        confidenceToNext
      }
      pathQuality
      qualityDifference
    }
  }
}

# 3. 노드 연결성 분석 - 특정 노드 중심의 네트워크 분석
query NodeConnectivityAnalysis($nodeId: ID!) {
  getNodeConnectivity(
    nodeId: $nodeId
    maxDepth: 3
    minStrength: 2    # strength >= 2만 고려
    minConfidence: 2  # confidence >= 2만 고려
  ) {
    centralNode {
      id
      content
      table {
        identifier
      }
    }

    # 연결된 노드들 - strength/confidence 필터링
    connectedNodes {
      node {
        id
        content
      }
      relation {
        strength
        confidence
        properties  # JSON 속성 활용
        type {
          identifier
          category
        }
      }
      distance        # 중심 노드로부터의 거리
      strength        # 연결 강도
      confidence      # 연결 신뢰도
    }

    # 관계 요약 - 정량적 분석
    relationshipSummary {
      totalConnections
      outgoingRelations
      incomingRelations
      bidirectionalRelations
      averageStrength
      averageConfidence
      relationTypeBreakdown {
        relationType {
          identifier
          category
        }
        count
      }
    }

    # 네트워크 위치 - 그래프 이론 메트릭
    networkPosition {
      centrality      # 중심성 지수
      betweenness     # 매개 중심성
      clustering      # 클러스터링 계수
      isHub           # 허브 노드 여부
      isBridge        # 브리지 노드 여부
    }

    influenceScore    # 전체 영향력 점수
  }
}

# 4. 관계 강도 분석 - strength 필드의 심층 분석
query RelationshipStrengthAnalysis($strengthFilter: StrengthAnalysisFilter!) {
  analyzeRelationshipStrength(filter: $strengthFilter) {
    # 전체 강도 통계
    overallStats {
      averageStrength
      strengthVariance
      distributionSkew
      reliabilityScore
    }

    # 타입별 강도 분석
    strengthByType {
      relationType {
        identifier
        category
      }
      averageStrength
      strengthRange {
        min
        max
      }
      reliability
    }

    # 강도 변화 추이
    strengthEvolution {
      timeWindow
      averageStrength
      trend  # INCREASING/STABLE/DECREASING/VOLATILE
    }

    # 약한 관계들 - 개선이 필요한 관계
    weakRelations {
      relation {
        id
        strength
        confidence
        sourceNode {
          content
        }
        targetNode {
          content
        }
      }
      strengthScore
      reason
      improvementSuggestions
    }

    # 강한 관계들 - 높은 품질의 관계
    strongRelations {
      relation {
        id
        strength
        confidence
        properties
      }
      strengthScore
      qualityIndicators
      utilizationPotential
    }
  }
}

# 5. 고신뢰도 관계 조회 - confidence 필드 활용
query HighConfidenceRelations {
  getHighConfidenceRelations(
    minConfidence: 3      # confident 이상만
    relationTypes: ["relatedTo", "references", "parentOf"]
    tableIds: ["6", "1", "5"]  # 특정 테이블들만
  ) {
    relation {
      id
      sourceNode {
        id
        content
        table {
          identifier
        }
      }
      targetNode {
        id
        content
        table {
          identifier
        }
      }
      type {
        identifier
        category
        description
      }
      strength
      confidence
      properties  # JSON 메타데이터
      createdAt
    }

    confidenceScore
    strengthScore

    # 품질 메트릭 - 관계의 전반적 품질
    qualityMetrics {
      consistency   # 일관성
      reliability   # 신뢰성
      accuracy      # 정확성
      completeness  # 완성도
    }

    validationStatus  # VERIFIED/CONFIDENT/UNCERTAIN/QUESTIONABLE/INVALID
  }
}

# 6. 관계 패턴 발견 - 그래프 패턴 자동 탐지
query RelationPatternDiscovery {
  discoverRelationPatterns(input: {
    tableIds: ["6"]  # Performance nodes에서 패턴 탐지
    patternTypes: [CLUSTER, CHAIN, STAR]
    minOccurrences: 2
    maxDepth: 3
    confidenceThreshold: 0.6
  }) {
    patternId
    description
    occurrences
    confidence

    # 패턴에 포함된 노드들
    nodes {
      id
      content
    }

    # 패턴을 구성하는 관계들
    relations {
      strength
      confidence
      type {
        identifier
        category
      }
    }

    strength        # 패턴 전체 강도
    significance    # 패턴의 중요도
  }
}

