# - strength 분포: 2(uncertain) ~ 4(veryStrong)
# - confidence 분포: 2(uncertain) ~ 4(verified)
# - properties: 풍부한 JSON 메타데이터
# - 다양한 관계 타입: semantic, structural, hierarchy, reference

# ✅ 새로운 기능들:
