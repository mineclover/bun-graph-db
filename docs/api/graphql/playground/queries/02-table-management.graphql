# ===================================================================
# 🗂️ Table Management - 테이블 관리 기본 연산
# ===================================================================
# 목적: 테이블 생성, 조회, 관리 기능을 테스트합니다.
# 난이도: ⭐⭐ (기본)
# 의존성: 01-basic-health.graphql 실행 권장
# ===================================================================

# 1. 모든 테이블 조회 - 현재 시스템의 테이블 목록
query GetAllTables {
  tables {
    id
    identifier
    name
    description
    createdAt
    updatedAt
    nodeCount
    relationCount
    
    # 속성 타입들
    attributeTypes {
      id
      name
      dataType
      isRequired
    }
  }
}

# ===================================================================
# 📋 Variables for Table Queries (테이블 쿼리용 변수)
# ===================================================================
# Playground 하단 Variables 섹션에 붙여넣으세요:
{
  "tableId": "table_123",
  "page": 0,
  "limit": 10
}

# 2. 페이지네이션이 적용된 테이블 조회
query GetTablesPaginated($page: Int!, $limit: Int!) {
  tables(
    pagination: {
      offset: $page
      limit: $limit
    }
    sort: [
      { field: "createdAt", direction: DESC }
    ]
  ) {
    id
    identifier
    name
    nodeCount
    createdAt
    
    # 최근 생성된 노드 미리보기
    nodes(limit: 3) {
      id
      content
      createdAt
    }
  }
}

# 3. 단일 테이블 상세 조회 - 특정 테이블의 모든 정보
query GetTableDetail($tableId: ID!) {
  table(id: $tableId) {
    id
    identifier
    name
    description
    createdAt
    updatedAt
    
    # 통계 정보
    nodeCount
    relationCount
    
    # 속성 타입 정보
    attributeTypes {
      id
      name
      description
      dataType        # STRING, NUMBER, BOOLEAN, DATE, JSON
      isRequired
      defaultValue
      validation      # JSON 형태의 검증 규칙
      usageCount      # 실제 사용 횟수
    }
    
    # 최근 노드들 (5개)
    nodes(limit: 5) {
      id
      content
      createdAt
      
      # 속성들
      attributes {
        name
        value
        type {
          name
          dataType
        }
      }
    }
  }
}

