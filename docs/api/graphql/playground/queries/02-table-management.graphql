# ===================================================================
# 🔍 Testing Scenarios (테스트 시나리오)
# ===================================================================

# 📝 시나리오 1: 빈 시스템 테스트
# 1. GetAllTables 실행 → 빈 배열 확인
# 2. 존재하지 않는 ID로 GetTableDetail 실행 → null 응답 확인

# 📝 시나리오 2: 데이터가 있는 시스템 테스트  
# 1. GetAllTables 실행 → 테이블 목록 확인
# 2. 첫 번째 테이블 ID로 GetTableDetail 실행 → 상세 정보 확인
# 3. 페이지네이션 테스트 (limit: 2로 설정)

# 📝 시나리오 3: 성능 테스트
# 1. 큰 limit 값으로 조회 (예: 1000) → 응답 시간 측정
# 2. 복잡한 중첩 쿼리로 테이블 상세 조회 → 성능 확인

# ===================================================================
# 🛠️ Troubleshooting Guide (문제해결 가이드)
# ===================================================================

# ❌ "Cannot query field" 오류
# → 스키마가 최신인지 확인: Docs 탭에서 최신 스키마 확인

# ❌ 빈 결과가 계속 나올 때
# → mutations/01-create-data.graphql로 테스트 데이터 생성 후 재시도

# ❌ 성능이 느릴 때
# → 불필요한 필드 제거, 페이지네이션 적용, limit 값 조정

# ❌ Variables 오류
# → Variables JSON 형식 확인, 타입 일치 확인 (ID는 문자열)

