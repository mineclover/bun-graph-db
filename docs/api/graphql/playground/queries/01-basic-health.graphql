# ===================================================================
# 🏥 Basic Health Check - 서버 상태 확인
# ===================================================================
# 목적: API 서버와 데이터베이스 연결 상태를 확인합니다.
# 난이도: ⭐ (초급)
# 실행 시간: <10ms
# ===================================================================

# 1. 기본 헬스체크 - 서버가 정상 작동하는지 확인
query BasicHealthCheck {
  health {
    status      # "healthy" | "degraded" | "unhealthy"
    timestamp   # 현재 서버 시간
    database    # 데이터베이스 연결 상태
    version     # API 버전
  }
}

# ===================================================================
# 📊 Expected Response (예상 응답)
# ===================================================================
# {
#   "data": {
#     "health": {
#       "status": "healthy",
#       "timestamp": "2025-09-06T12:00:00.000Z",
#       "database": true,
#       "version": "1.0.0"
#     }
#   }
# }

# ===================================================================
# 🔍 Troubleshooting (문제해결)
# ===================================================================
# ❌ 연결 실패: 개발 서버가 실행 중인지 확인
#    → bun run dev
# ❌ database: false: SQLite 파일 권한 확인
#    → 프로젝트 디렉토리 권한 점검
# ❌ status: "unhealthy": 로그 확인 후 서버 재시작