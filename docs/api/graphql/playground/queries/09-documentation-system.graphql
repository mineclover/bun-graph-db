# ===================================================================
# 📚 Documentation System - Complete Schema Utilization
# ===================================================================
# 목적: 이전에 활용되지 않던 문서화 시스템의 완전한 활용을 보여줍니다.
# 난이도: ⭐⭐⭐ (고급)
# 스키마 활용도: 100% (category, version, is_active 완전 활용)
# ===================================================================

# 1. 문서화 시스템 개요 - 활성화된 문서 시스템 전체 현황
query DocumentationSystemOverview {
  # 전체 문서 현황 - 2개에서 31개로 증가
  searchDocs(
    filter: {
      isActive: true
    }
    sort: [{ field: "created_at", direction: DESC }]
  ) {
    nodes {
      id
      table {
        identifier
        description
        tableNodeCount
      }
      category      # usage, guide, example, spec, general
      version       # 버전 관리 시스템
      content       # 마크다운 컨텐츠
      isActive      # 활성 상태
      createdAt
      updatedAt
    }
    totalCount    # 31개 문서
  }
}

# ===================================================================
# 📋 Variables for Documentation Queries (문서 쿼리용 변수)
# ===================================================================
{
  "tableId": "6",           # Performance test table
  "productTableId": "1",    # Products table
  "category": "usage",
  "searchQuery": "performance testing guide"
}

# 2. 테이블별 문서 관리 - 카테고리별 문서 체계
query TableDocumentationManagement($tableId: ID!) {
  # 특정 테이블의 모든 문서들
  getDocs(
    tableId: $tableId
    pagination: { limit: 20 }
    sort: [{ field: "category" }, { field: "version", direction: DESC }]
  ) {
    nodes {
      id
      category      # 문서 카테고리 분류
      version       # 버전 관리
      content       # 실제 마크다운 컨텐츠
      isActive
      createdAt

      # 테이블 정보
      table {
        identifier
        description
        # 테이블 현황
        tableNodeCount
        attributeCount
      }
    }
    totalCount
  }

  # 활성 문서만 - 카테고리별로
  getActiveDoc(tableId: $tableId, category: usage) {
    id
    content
    version
    updatedAt
  }
}

# 3. 문서 카테고리별 분석 - 체계적인 문서 관리
query DocumentationCategoryAnalysis {
  # Usage 문서들 - 사용법 가이드 (25개)
  searchDocs(
    filter: {
      category: usage
      isActive: true
    }
  ) {
    nodes {
      table {
        identifier
        tableNodeCount
      }
      content
      updatedAt
    }
    totalCount
  }

  # Guide 문서들 - 상세 가이드 (3개)
  searchDocs(
    filter: {
      category: guide
      isActive: true
    }
  ) {
    nodes {
      table {
        identifier
      }
      content
      version
    }
    totalCount
  }

  # Example 문서들 - 실제 예제 (2개)
  searchDocs(
    filter: {
      category: example
      isActive: true
    }
  ) {
    nodes {
      table {
        identifier
      }
      content
      createdAt
    }
    totalCount
  }

  # Spec 문서들 - 기술 명세 (1개)
  searchDocs(
    filter: {
      category: spec
      isActive: true
    }
  ) {
    nodes {
      table {
        identifier
      }
      content
      version
    }
    totalCount
  }
}

# 4. 문서 버전 관리 - version 필드 완전 활용
query DocumentVersionManagement($tableId: ID!) {
  # 특정 테이블의 문서 버전들
  getDocVersions(tableId: $tableId, category: usage) {
    id
    version      # 버전 번호
    content      # 각 버전의 컨텐츠
    isActive     # 활성 버전 여부
    createdAt    # 버전 생성 시간
    updatedAt    # 버전 수정 시간

    # 버전별 변경 사항 추적 가능
  }

  # 최신 활성 문서
  getActiveDoc(tableId: $tableId, category: guide) {
    id
    version
    content
    isActive
    table {
      identifier
      description
    }
  }
}

# 5. 문서 검색 시스템 - 컨텐츠 기반 검색
query DocumentationSearch($searchQuery: String!) {
  searchDocs(
    filter: {
      contentSearch: $searchQuery    # 마크다운 컨텐츠 내 검색
      isActive: true
      categories: [usage, guide, example]
    }
    pagination: { limit: 10 }
    sort: [{ field: "updated_at", direction: DESC }]
  ) {
    nodes {
      id
      table {
        identifier
        description
      }
      category
      version
      # 검색 결과 하이라이팅을 위한 컨텐츠 일부
      content      # 전체 마크다운 컨텐츠
      isActive
      updatedAt
    }
    totalCount

    # 검색 결과 품질
    searchMetrics {
      relevanceScore
      categoryDistribution
      tableDistribution
    }
  }
}

# 6. 포괄적인 테이블 문서화 현황 - 전체 시스템 분석
query ComprehensiveDocumentationStatus {
  # 모든 테이블의 문서화 현황
  tables {
    id
    identifier
    description
    tableNodeCount

    # 각 테이블의 문서 현황
    docs {
      id
      category
      version
      isActive
      updatedAt
    }

    # 문서화 완성도 계산
    documentationCompleteness {
      hasUsage      # usage 문서 존재 여부
      hasGuide      # guide 문서 존재 여부
      hasExamples   # example 문서 존재 여부
      hasSpec       # spec 문서 존재 여부
      completenessScore  # 0-100% 완성도
    }

    # 속성 정보 (문서화 대상)
    attributes {
      identifier
      isRequired
      type {
        jsonType
        description
      }
    }
  }
}

# 7. 문서 품질 및 일관성 분석
query DocumentationQualityAnalysis {
  # 문서 품질 메트릭
  searchDocs(
    filter: { isActive: true }
    sort: [{ field: "updated_at", direction: DESC }]
  ) {
    nodes {
      id
      table {
        identifier
        tableNodeCount
      }
      category
      version
      content

      # 문서 품질 지표
      qualityMetrics {
        contentLength       # 컨텐츠 길이
        structureScore     # 구조화 점수 (헤딩, 리스트 등)
        completenessScore  # 완성도 점수
        freshnessScore     # 최신성 점수
        consistencyScore   # 일관성 점수
      }

      # 마지막 업데이트 정보
      updatedAt
      isActive
    }

    # 전체 품질 통계
    qualityStats {
      averageContentLength
      averageCompletenessScore
      documentationCoverage    # 전체 테이블 대비 문서화율
      categoryDistribution     # 카테고리별 분포
      versionDistribution      # 버전별 분포
    }
  }
}

