# Contract Synchronization API Contract
# Purpose: Synchronize MCP tool contracts with GraphQL schema changes

type Query {
  """
  Get all contract mappings for a specific tool
  """
  getToolContracts(toolName: String!): [ContractMapping!]!

  """
  Get contract mapping status and health
  """
  getContractStatus(
    toolName: String
    schemaVersion: String
  ): ContractStatusReport!
}

type Mutation {
  """
  Synchronize contracts with current schema
  """
  syncContracts(
    input: ContractSyncInput!
  ): ContractSyncResult!

  """
  Update specific contract mapping
  """
  updateContractMapping(
    input: UpdateContractMappingInput!
  ): ContractMapping!

  """
  Validate contract mapping against schema
  """
  validateContract(
    input: ValidateContractInput!
  ): ContractValidationResult!
}

# Input types
input ContractSyncInput {
  toolNames: [String!] # If empty, sync all tools
  schemaVersion: String # If empty, use latest
  forceUpdate: Boolean = false
  dryRun: Boolean = false
}

input UpdateContractMappingInput {
  id: ID!
  graphqlOperation: String
  inputMapping: JSON
  outputMapping: JSON
  validationRules: JSON
  status: ContractStatus
}

input ValidateContractInput {
  toolName: String!
  graphqlOperation: String!
  schemaVersion: String
}

# Output types
type ContractMapping {
  id: ID!
  mcpToolName: String!
  graphqlOperation: String!
  operationType: OperationType!
  schemaSnapshotId: ID!
  inputMapping: JSON!
  outputMapping: JSON!
  validationRules: JSON!
  status: ContractStatus!
  compatibilityLevel: CompatibilityLevel!
  createdAt: DateTime!
  lastValidated: DateTime
}

type ContractStatusReport {
  toolName: String!
  totalMappings: Int!
  healthyMappings: Int!
  deprecatedMappings: Int!
  failedMappings: Int!
  overallHealth: ContractHealth!
  lastSyncTime: DateTime
  issues: [ContractIssue!]!
}

type ContractSyncResult {
  success: Boolean!
  processedTools: [String!]!
  updatedMappings: Int!
  createdMappings: Int!
  deprecatedMappings: Int!
  errors: [ContractSyncError!]!
  warnings: [String!]!
  duration: Int! # milliseconds
}

type ContractValidationResult {
  valid: Boolean!
  compatibilityLevel: CompatibilityLevel!
  issues: [ValidationIssue!]!
  suggestedMapping: JSON
}

type ContractIssue {
  type: IssueType!
  severity: IssueSeverity!
  message: String!
  path: String
  suggestion: String
}

type ContractSyncError {
  toolName: String!
  operation: String!
  code: String!
  message: String!
  details: JSON
}

type ValidationIssue {
  field: String!
  type: ValidationIssueType!
  message: String!
  expected: String
  actual: String
}

# Enums
enum OperationType {
  QUERY
  MUTATION
  SUBSCRIPTION
}

enum ContractStatus {
  ACTIVE
  DEPRECATED
  DISABLED
  MIGRATING
}

enum CompatibilityLevel {
  FULL
  PARTIAL
  LIMITED
  INCOMPATIBLE
}

enum ContractHealth {
  HEALTHY
  DEGRADED
  CRITICAL
}

enum IssueType {
  SCHEMA_MISMATCH
  MAPPING_ERROR
  VALIDATION_FAILURE
  PERFORMANCE_WARNING
}

enum IssueSeverity {
  INFO
  WARNING
  ERROR
  CRITICAL
}

enum ValidationIssueType {
  MISSING_FIELD
  TYPE_MISMATCH
  INVALID_OPERATION
  DEPRECATED_USAGE
}

# Custom scalars
scalar DateTime
scalar JSON