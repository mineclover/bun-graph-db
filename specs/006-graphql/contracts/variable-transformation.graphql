# Variable Transformation API Contract
# Purpose: Transform variables between MCP and GraphQL formats

type Query {
  """
  Get transformation rules for a specific tool
  """
  getTransformationRules(
    toolName: String!
    operation: String
  ): [VariableTransformer!]!

  """
  Preview variable transformation without executing
  """
  previewTransformation(
    input: TransformationPreviewInput!
  ): TransformationPreview!
}

type Mutation {
  """
  Transform MCP arguments to GraphQL variables
  """
  transformToGraphQL(
    input: TransformToGraphQLInput!
  ): GraphQLTransformResult!

  """
  Transform GraphQL response to MCP format
  """
  transformFromGraphQL(
    input: TransformFromGraphQLInput!
  ): McpTransformResult!

  """
  Update transformation rules
  """
  updateTransformationRules(
    input: UpdateTransformationRulesInput!
  ): VariableTransformer!
}

# Input types
input TransformationPreviewInput {
  toolName: String!
  mcpArguments: JSON!
  direction: TransformationDirection!
  schemaVersion: String
}

input TransformToGraphQLInput {
  toolName: String!
  operation: String!
  mcpArguments: JSON!
  validateInput: Boolean = true
}

input TransformFromGraphQLInput {
  toolName: String!
  operation: String!
  graphqlResponse: JSON!
  validateOutput: Boolean = true
}

input UpdateTransformationRulesInput {
  id: ID!
  transformationRules: JSON!
  scalarMappings: JSON
  validationSchema: JSON
  defaultValues: JSON
  version: String!
}

# Output types
type VariableTransformer {
  id: ID!
  contractMappingId: ID!
  transformationRules: JSON!
  scalarMappings: JSON!
  validationSchema: JSON!
  defaultValues: JSON
  errorHandling: JSON
  performanceHints: JSON
  version: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TransformationPreview {
  input: JSON!
  output: JSON!
  warnings: [String!]!
  errors: [TransformationError!]!
  performance: TransformationPerformance!
}

type GraphQLTransformResult {
  success: Boolean!
  variables: JSON!
  operationName: String
  query: String!
  errors: [TransformationError!]!
  warnings: [String!]!
  metadata: TransformationMetadata!
}

type McpTransformResult {
  success: Boolean!
  content: [McpContent!]!
  isError: Boolean!
  errors: [TransformationError!]!
  warnings: [String!]!
  metadata: TransformationMetadata!
}

type McpContent {
  type: String! # "text", "image", "resource", etc.
  text: String
  data: String
  mimeType: String
}

type TransformationError {
  code: String!
  message: String!
  field: String
  expectedType: String
  actualType: String
  details: JSON
}

type TransformationMetadata {
  duration: Int! # microseconds
  rulesApplied: [String!]!
  scalarsConverted: [String!]!
  defaultsUsed: [String!]!
}

type TransformationPerformance {
  estimatedDuration: Int! # microseconds
  complexity: TransformationComplexity!
  warnings: [String!]!
}

# Enums
enum TransformationDirection {
  TO_GRAPHQL
  FROM_GRAPHQL
}

enum TransformationComplexity {
  LOW
  MEDIUM
  HIGH
  VERY_HIGH
}

# Custom scalars
scalar DateTime
scalar JSON