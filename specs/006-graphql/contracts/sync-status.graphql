# Sync Status API Contract
# Purpose: Monitor synchronization status and system health

type Query {
  """
  Get overall synchronization system status
  """
  getSyncStatus: SyncSystemStatus!

  """
  Get detailed sync history and events
  """
  getSyncHistory(
    limit: Int = 50
    offset: Int = 0
    severity: SyncSeverity
    eventType: SyncEventType
    since: DateTime
  ): SyncHistoryPage!

  """
  Get sync statistics and metrics
  """
  getSyncMetrics(
    timeRange: TimeRange = LAST_24_HOURS
  ): SyncMetrics!
}

type Subscription {
  """
  Subscribe to real-time sync events
  """
  syncEvents(
    severity: SyncSeverity
    eventTypes: [SyncEventType!]
  ): SyncEvent!

  """
  Subscribe to sync system health changes
  """
  syncHealthChanges: SyncSystemStatus!
}

# Main status type
type SyncSystemStatus {
  overall: SystemHealth!
  lastSyncTime: DateTime
  nextScheduledSync: DateTime
  currentSchemaVersion: String!
  activeTools: Int!
  healthyMappings: Int!
  totalMappings: Int!
  recentErrors: [SyncEvent!]!
  components: [ComponentStatus!]!
}

type SyncHistoryPage {
  events: [SyncEvent!]!
  totalCount: Int!
  hasNextPage: Boolean!
}

type SyncEvent {
  id: ID!
  eventType: SyncEventType!
  schemaSnapshotId: ID
  changesDetected: [SchemaChange!]!
  affectedMappings: [ID!]!
  syncDuration: Int # milliseconds
  errors: [SyncEventError!]!
  metadata: JSON!
  triggeredBy: SyncTrigger!
  severity: SyncSeverity!
  timestamp: DateTime!
}

type SyncMetrics {
  timeRange: TimeRange!
  totalSyncs: Int!
  successfulSyncs: Int!
  failedSyncs: Int!
  averageSyncDuration: Float! # milliseconds
  schemaChangesDetected: Int!
  toolsUpdated: Int!
  errorsByType: [ErrorMetric!]!
  performanceData: [PerformanceMetric!]!
}

type ComponentStatus {
  component: String!
  status: ComponentHealth!
  lastCheck: DateTime!
  details: String
  metrics: JSON
}

type SyncEventError {
  code: String!
  message: String!
  component: String
  retryable: Boolean!
  details: JSON
}

type ErrorMetric {
  errorType: String!
  count: Int!
  percentage: Float!
  lastOccurrence: DateTime!
}

type PerformanceMetric {
  timestamp: DateTime!
  syncDuration: Int!
  changesProcessed: Int!
  toolsAffected: Int!
}

type SchemaChange {
  type: SchemaChangeType!
  path: String!
  description: String!
  breaking: Boolean!
  severity: ChangeSeverity!
  oldValue: String
  newValue: String
}

# Enums
enum SystemHealth {
  HEALTHY
  DEGRADED
  UNHEALTHY
  CRITICAL
}

enum ComponentHealth {
  HEALTHY
  DEGRADED
  FAILED
  UNKNOWN
}

enum SyncEventType {
  SCHEMA_DETECTED
  SYNC_TRIGGERED
  MAPPING_UPDATED
  VALIDATION_FAILED
  ROLLBACK_PERFORMED
  HEALTH_CHECK_FAILED
  PERFORMANCE_WARNING
}

enum SyncSeverity {
  INFO
  WARNING
  ERROR
  CRITICAL
}

enum SyncTrigger {
  SCHEDULED
  WEBHOOK
  MANUAL
  HEALTH_CHECK
  ERROR_RECOVERY
}

enum TimeRange {
  LAST_HOUR
  LAST_24_HOURS
  LAST_7_DAYS
  LAST_30_DAYS
  CUSTOM
}

enum SchemaChangeType {
  TYPE_ADDED
  TYPE_REMOVED
  TYPE_CHANGED
  FIELD_ADDED
  FIELD_REMOVED
  FIELD_CHANGED
  ARGUMENT_ADDED
  ARGUMENT_REMOVED
  ARGUMENT_CHANGED
  ENUM_VALUE_ADDED
  ENUM_VALUE_REMOVED
}

enum ChangeSeverity {
  INFO
  WARNING
  ERROR
  CRITICAL
}

# Custom scalars
scalar DateTime
scalar JSON