# Tool Validation API Contract
# Purpose: Validate MCP tools against GraphQL schema requirements

type Query {
  """
  Validate all tools against current schema
  """
  validateAllTools(
    schemaVersion: String
    includePerfTest: Boolean = false
  ): ToolValidationReport!

  """
  Validate specific tool operations
  """
  validateTool(
    toolName: String!
    operations: [String!]
    schemaVersion: String
  ): SingleToolValidation!

  """
  Get tool compatibility matrix
  """
  getCompatibilityMatrix(
    toolNames: [String!]
    schemaVersions: [String!]
  ): CompatibilityMatrix!
}

type Mutation {
  """
  Register new MCP tool for validation
  """
  registerTool(
    input: RegisterToolInput!
  ): ToolRegistration!

  """
  Update tool definition and re-validate
  """
  updateToolDefinition(
    input: UpdateToolDefinitionInput!
  ): ToolValidationResult!

  """
  Mark tool as deprecated
  """
  deprecateTool(
    toolName: String!
    reason: String!
    migrationPath: String
  ): DeprecationResult!
}

# Input types
input RegisterToolInput {
  toolName: String!
  description: String!
  operations: [ToolOperationInput!]!
  metadata: JSON
}

input ToolOperationInput {
  name: String!
  graphqlOperation: String!
  inputSchema: JSON!
  description: String
}

input UpdateToolDefinitionInput {
  toolName: String!
  operations: [ToolOperationInput!]
  metadata: JSON
  validateOnly: Boolean = false
}

# Output types
type ToolValidationReport {
  totalTools: Int!
  validTools: Int!
  invalidTools: Int!
  deprecatedTools: Int!
  overallHealth: ValidationHealth!
  toolResults: [SingleToolValidation!]!
  schemaVersion: String!
  validationTimestamp: DateTime!
  performanceMetrics: ValidationPerformanceMetrics
}

type SingleToolValidation {
  toolName: String!
  valid: Boolean!
  compatibilityLevel: CompatibilityLevel!
  operationResults: [OperationValidation!]!
  issues: [ValidationIssue!]!
  recommendations: [String!]!
  performance: ToolPerformanceMetrics
}

type OperationValidation {
  operationName: String!
  valid: Boolean!
  compatibilityLevel: CompatibilityLevel!
  issues: [ValidationIssue!]!
  graphqlOperation: String!
  inputSchemaValid: Boolean!
  outputSchemaValid: Boolean!
  performanceScore: Float # 0-100
}

type ValidationIssue {
  type: ValidationIssueType!
  severity: ValidationSeverity!
  field: String
  message: String!
  suggestion: String
  fixable: Boolean!
  impact: IssueImpact!
}

type CompatibilityMatrix {
  tools: [String!]!
  schemaVersions: [String!]!
  matrix: [[CompatibilityScore!]!]!
  lastUpdated: DateTime!
}

type CompatibilityScore {
  toolName: String!
  schemaVersion: String!
  score: Float! # 0-100
  level: CompatibilityLevel!
  issues: Int!
  lastValidated: DateTime!
}

type ToolRegistration {
  success: Boolean!
  toolName: String!
  registrationId: ID!
  validationResult: SingleToolValidation!
  warnings: [String!]!
}

type ToolValidationResult {
  success: Boolean!
  toolName: String!
  validation: SingleToolValidation!
  changes: [ToolChange!]!
  warnings: [String!]!
}

type DeprecationResult {
  success: Boolean!
  toolName: String!
  deprecationDate: DateTime!
  migrationDeadline: DateTime
  affectedClients: [String!]!
}

type ValidationPerformanceMetrics {
  totalDuration: Int! # milliseconds
  toolsPerSecond: Float!
  cacheHitRate: Float!
  errors: Int!
}

type ToolPerformanceMetrics {
  validationDuration: Int! # milliseconds
  operationsValidated: Int!
  cacheUsed: Boolean!
  complexity: ValidationComplexity!
}

type ToolChange {
  type: ChangeType!
  field: String!
  oldValue: String
  newValue: String!
  breaking: Boolean!
}

# Enums
enum ValidationHealth {
  EXCELLENT
  GOOD
  FAIR
  POOR
  CRITICAL
}

enum CompatibilityLevel {
  FULL
  PARTIAL
  LIMITED
  INCOMPATIBLE
}

enum ValidationIssueType {
  SCHEMA_MISMATCH
  TYPE_ERROR
  MISSING_FIELD
  INVALID_OPERATION
  DEPRECATED_USAGE
  PERFORMANCE_WARNING
  SECURITY_CONCERN
}

enum ValidationSeverity {
  INFO
  WARNING
  ERROR
  CRITICAL
}

enum IssueImpact {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum ValidationComplexity {
  SIMPLE
  MODERATE
  COMPLEX
  VERY_COMPLEX
}

enum ChangeType {
  OPERATION_ADDED
  OPERATION_REMOVED
  OPERATION_MODIFIED
  SCHEMA_UPDATED
  METADATA_CHANGED
}

# Custom scalars
scalar DateTime
scalar JSON