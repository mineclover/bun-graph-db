# GraphQL Schema Extensions for Table Export/Import System

extend type Mutation {
  # Export a single table or multiple related tables
  exportTable(input: ExportTableInput!): ExportTableResult!

  # Import table package(s) from file system
  importTablePackage(input: ImportTablePackageInput!): ImportTablePackageResult!

  # Resolve import conflicts when detected
  resolveImportConflicts(input: ResolveConflictsInput!): ResolveConflictsResult!

  # Cancel an ongoing import session
  cancelImportSession(sessionId: ID!): CancelSessionResult!
}

extend type Query {
  # Get export/import session status
  getImportSession(sessionId: ID!): ImportSession

  # List available table packages in export directory
  listTablePackages(directory: String): [TablePackageInfo!]!

  # Validate table package compatibility before import
  validateTablePackage(packagePath: String!): ValidationResult!

  # Preview import operations without executing
  previewImport(input: ImportTablePackageInput!): ImportPreview!
}

# Input Types

input ExportTableInput {
  # Single table export
  tableId: ID

  # Multiple table export
  tableIds: [ID!]

  # Export all related tables (follows relationships)
  includeRelatedTables: Boolean = false

  # Export options
  options: ExportOptions
}

input ExportOptions {
  # Target directory for export packages
  outputDirectory: String

  # Include data or schema only
  includeData: Boolean = true

  # Batch size for large datasets
  batchSize: Int = 1000

  # Compression level (if applicable)
  compressionLevel: Int = 0
}

input ImportTablePackageInput {
  # Single package import
  packagePath: String

  # Multiple package import
  packagePaths: [String!]

  # Import options
  options: ImportOptions
}

input ImportOptions {
  # Conflict resolution strategy
  conflictResolution: ConflictResolutionStrategy = ASK_USER

  # Skip validation (dangerous)
  skipValidation: Boolean = false

  # Dry run mode (preview only)
  dryRun: Boolean = false

  # Batch size for imports
  batchSize: Int = 1000

  # Enable rollback on failure
  enableRollback: Boolean = true
}

input ResolveConflictsInput {
  sessionId: ID!
  resolutions: [ConflictResolution!]!
}

input ConflictResolution {
  conflictId: ID!
  resolution: ConflictResolutionType!
  newTableName: String # Required for RENAME resolution
}

# Enums

enum ConflictResolutionStrategy {
  ASK_USER
  OVERWRITE_ALL
  MERGE_ALL
  RENAME_ALL
  FAIL_ON_CONFLICT
}

enum ConflictResolutionType {
  OVERWRITE
  MERGE
  RENAME
  SKIP
}

enum ImportSessionStatus {
  PENDING
  ANALYZING
  IMPORTING
  COMPLETED
  FAILED
  ROLLED_BACK
  CANCELLED
}

enum ConflictType {
  TABLE_EXISTS
  SCHEMA_MISMATCH
  DATA_CONFLICT
  DEPENDENCY_MISSING
}

# Result Types

type ExportTableResult {
  success: Boolean!
  exportId: ID
  packagePaths: [String!]
  totalSize: Int
  recordCount: Int
  duration: Int # milliseconds
  errors: [ExportError!]!
}

type ImportTablePackageResult {
  success: Boolean!
  sessionId: ID
  importedTables: [String!]
  totalRecords: Int
  duration: Int # milliseconds
  conflicts: [ImportConflict!]!
  errors: [ImportError!]!
}

type ResolveConflictsResult {
  success: Boolean!
  sessionId: ID!
  resolvedConflicts: Int!
  remainingConflicts: Int!
  errors: [ConflictError!]!
}

type CancelSessionResult {
  success: Boolean!
  sessionId: ID!
  rollbackCompleted: Boolean!
  errors: [String!]!
}

type ValidationResult {
  valid: Boolean!
  errors: [ValidationError!]!
  warnings: [ValidationWarning!]!
  packageInfo: TablePackageInfo
}

type ImportPreview {
  estimatedDuration: Int # milliseconds
  totalTables: Int!
  totalRecords: Int!
  dependencies: [DependencyInfo!]!
  potentialConflicts: [ImportConflict!]!
  requiredSpace: Int # bytes
}

# Core Types

type ImportSession {
  id: ID!
  status: ImportSessionStatus!
  packagePaths: [String!]!
  startedAt: DateTime!
  completedAt: DateTime
  progress: ImportProgress
  conflicts: [ImportConflict!]!
  errors: [ImportError!]!
}

type ImportProgress {
  totalTables: Int!
  processedTables: Int!
  currentTable: String
  currentOperation: String
  percentage: Float!
  estimatedTimeRemaining: Int # milliseconds
}

type ImportConflict {
  id: ID!
  type: ConflictType!
  tableId: String!
  tableName: String!
  message: String!
  resolutionOptions: [ConflictResolutionType!]!
  userChoice: ConflictResolutionType
}

type TablePackageInfo {
  tableId: ID!
  tableName: String!
  packagePath: String!
  version: String!
  exportedAt: DateTime!
  recordCount: Int!
  size: Int! # bytes
  dependencies: [String!]!
  checksum: String!
}

type DependencyInfo {
  tableId: ID!
  tableName: String!
  dependsOn: [String!]!
  dependencyLevel: Int!
}

# Error Types

type ExportError {
  code: String!
  message: String!
  tableId: String
  details: String
}

type ImportError {
  code: String!
  message: String!
  tableId: String
  operation: String
  details: String
}

type ConflictError {
  code: String!
  message: String!
  conflictId: ID!
  details: String
}

type ValidationError {
  code: String!
  message: String!
  field: String
  details: String
}

type ValidationWarning {
  code: String!
  message: String!
  recommendation: String
}

# Scalar Types (if not already defined)
scalar DateTime
scalar JSON