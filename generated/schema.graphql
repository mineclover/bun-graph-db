# ========== queries/node-queries.graphql ==========
# Node Query extensions

extend type Query {
  # Get single node
  node(id: ID!): TableNode
  nodeByContent(content: String!, tableId: ID!): TableNode

  # Get multiple nodes with filtering and pagination
  nodes(filter: NodesFilter, pagination: NodesPagination, sort: [SortInput!]): NodesConnection!

  # Advanced node search
  searchNodes(
    filter: SearchNodesFilter!
    pagination: NodesPagination
    sort: [SortInput!]
  ): NodesConnection!
}


# ========== queries/table-queries.graphql ==========
# Table Query extensions

extend type Query {
  # Get single table
  table(id: ID!): Table
  tableByIdentifier(identifier: String!): Table

  # Get multiple tables with filtering and pagination
  tables(filter: TablesFilter, pagination: TablesPagination, sort: [SortInput!]): TablesConnection!
}


# ========== queries/attribute-queries.graphql ==========
# Attribute Query extensions

extend type Query {
  # Attribute Type queries
  attributeType(id: ID!): AttributeType
  attributeTypeByIdentifier(identifier: String!): AttributeType
  attributeTypes(
    filter: AttributeTypesFilter
    pagination: PaginationInput
    sort: [SortInput!]
  ): AttributeTypesConnection!

  # Attribute queries
  attribute(id: ID!): Attribute
  attributeByIdentifier(identifier: String!, tableId: ID!): Attribute
  attributes(
    filter: AttributesFilter
    pagination: PaginationInput
    sort: [SortInput!]
  ): AttributesConnection!
}


# ========== queries/relation-queries.graphql ==========
# Relation Query extensions

extend type Query {
  # Relation Type queries
  relationType(id: ID!): RelationType
  relationTypeByIdentifier(identifier: String!): RelationType
  relationTypes(
    filter: FilterInput
    pagination: PaginationInput
    sort: [SortInput!]
  ): [RelationType!]!

  # Node Relation queries
  nodeRelation(id: ID!): NodeRelation
  nodeRelations(
    filter: NodeRelationsFilter
    pagination: PaginationInput
    sort: [SortInput!]
  ): NodeRelationsConnection!

  # Graph relationship queries
  searchRelatedNodes(
    filter: SearchRelatedNodesFilter!
    pagination: PaginationInput
  ): RelatedNodesConnection!

  # Graph analysis queries
  findPathsBetweenNodes(input: FindPathsInput!): [NodePath!]!

  getDependencyChain(input: DependencyChainInput!): RelatedNodesConnection!
}


# ========== queries/template-queries.graphql ==========
# Query Template Query extensions

extend type Query {
  # Get single template
  getTemplate(id: ID!): QueryTemplate
  getTemplateByIdentifier(identifier: String!): QueryTemplate

  # Search templates
  searchTemplates(
    filter: QueryTemplatesFilter
    pagination: PaginationInput
    sort: [SortInput!]
  ): QueryTemplatesConnection!

  # Get popular templates
  getPopularTemplates(limit: Int = 10): [QueryTemplate!]!

  # Table dependency queries
  templatesByTable(input: FindTemplatesByTableInput!): [QueryTemplate!]!
  templatesWithTableDependencies: [QueryTemplate!]!
  tableDependencyTemplates: [TableDependencyTemplateResult!]!

  # Execute template (also available as mutation)
  executeTemplate(input: ExecuteQueryTemplateInput!): ExecuteQueryTemplatePayload!
}


# ========== queries/system-queries.graphql ==========
extend type Query {
  # System monitoring and statistics
  systemStats: SystemStats!
  memoryStats: MemoryStats!
  healthCheck: HealthStatus!
  systemHealthCheck: SystemHealthStatus!
}

type SystemStats {
  memory: MemoryStats!
  process: ProcessStats!
  database: DatabaseStats!
  timestamp: DateTime!
  uptime: Int!
}

type MemoryStats {
  used: Int!
  free: Int!
  total: Int!
  percentage: Float!
  heap: HeapStats!
}

type HeapStats {
  used: Int!
  total: Int!
  external: Int!
  arrayBuffers: Int!
}

type ProcessStats {
  pid: Int!
  cpu: Float!
  version: String!
  platform: String!
  memoryDetails: ProcessMemoryDetails!
}

type ProcessMemoryDetails {
  rss: Int! # Resident Set Size in MB
  heapUsed: Int! # Used heap memory in MB
  heapTotal: Int! # Total allocated heap in MB
  external: Int! # External C++ objects memory in MB
  arrayBuffers: Int! # ArrayBuffers memory in MB
  heapEfficiency: Int! # Heap efficiency percentage
  memoryPressure: String! # Memory pressure level: low/medium/high
}

type DatabaseStats {
  connectionCount: Int!
  queryCount: Int!
  averageQueryTime: Float!
}

type SystemHealthStatus {
  status: String!
  timestamp: DateTime!
  database: Boolean!
  version: String!
  memory: MemoryHealthStatus!
}

type MemoryHealthStatus {
  status: String! # "healthy", "warning", "critical"
  percentage: Float!
  message: String
}


# ========== queries/template-performance-queries.graphql ==========
# Template Performance Query extensions - Utilizing performance tracking fields
# This file implements 100% utilization of template performance tracking system

extend type Query {
  # Template Performance Analytics - Previously unused functionality
  templatePerformanceAnalytics(
    filter: TemplatePerformanceFilter
    timeRange: TimeRangeInput
  ): TemplatePerformanceAnalytics!

  # Hot Queries - High usage, good performance templates
  getHotQueries(
    limit: Int = 10
    performanceThreshold: Int = 150
    usageThreshold: Int = 100
  ): [HotQueryTemplate!]!

  # Template Execution History - Detailed performance logs
  getTemplateExecutionHistory(
    templateId: ID!
    pagination: PaginationInput
    filter: ExecutionHistoryFilter
  ): TemplateExecutionConnection!

  # Performance Trends - Time-based analysis
  getTemplatePerformanceTrends(
    templateIds: [ID!]
    timeRange: TimeRangeInput!
    granularity: TimeGranularity = HOUR
  ): [TemplatePerformanceTrend!]!

  # Slow Query Analysis - Identify performance bottlenecks
  getSlowQueries(
    threshold: Int = 500
    limit: Int = 20
    timeRange: TimeRangeInput
  ): [SlowQueryAnalysis!]!

  # Template Recommendations - Based on usage patterns
  getTemplateRecommendations(
    context: RecommendationContext!
    limit: Int = 5
  ): [TemplateRecommendation!]!
}

