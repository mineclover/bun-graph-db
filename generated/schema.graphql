# ========== queries/enhanced-relations-queries.graphql ==========
# Enhanced Relations Query extensions - Full utilization of relations schema
# This file implements 100% utilization of the relations system including strength, confidence, and external references

extend type Query {
  # Relation Analytics - Previously underutilized relationship analysis
  relationAnalytics(
    filter: RelationAnalyticsFilter
  ): RelationAnalytics!

  # Graph Traversal - Utilize strength and confidence for pathfinding
  findOptimalPath(
    input: OptimalPathInput!
  ): OptimalPath!

  # Node Connectivity Analysis - Network analysis using relations
  getNodeConnectivity(
    nodeId: ID!
    maxDepth: Int = 3
    minStrength: Int = 1
    minConfidence: Int = 1
  ): NodeConnectivityResult!

  # Relationship Strength Analysis - Utilize strength field
  analyzeRelationshipStrength(
    filter: StrengthAnalysisFilter
  ): RelationshipStrengthAnalysis!

  # External Reference Resolution - Utilize external_id fields
  resolveExternalReferences(
    input: ExternalReferenceInput!
  ): ExternalReferenceResult!

  # Relation Pattern Discovery - Advanced graph analysis
  discoverRelationPatterns(
    input: PatternDiscoveryInput!
  ): [RelationPattern!]!

  # Confidence-based Filtering - Utilize confidence scores
  getHighConfidenceRelations(
    minConfidence: Int = 3
    relationTypes: [String!]
    tableIds: [ID!]
  ): [HighConfidenceRelation!]!
}

# Relation analytics types
type RelationAnalytics {
  totalRelations: Int!
  internalRelations: Int!
  externalRelations: Int!
  relationTypeDistribution: [RelationTypeStats!]!
  strengthDistribution: StrengthDistribution!
  confidenceDistribution: ConfidenceDistribution!
  tableConnectivity: [TableConnectivity!]!
  networkMetrics: NetworkMetrics!
}

type RelationTypeStats {
  relationType: RelationType!
  count: Int!
  averageStrength: Float!
  averageConfidence: Float!
  externalReferences: Int!
}

type StrengthDistribution {
  invalid: Int!      # strength = 0
  autoGenerated: Int! # strength = 1
  uncertain: Int!     # strength = 2
  confident: Int!     # strength = 3
  veryStrong: Int!    # strength = 4
}

type ConfidenceDistribution {
  probablyWrong: Int!    # confidence = 0
  autoGenerated: Int!    # confidence = 1
  uncertainButValid: Int! # confidence = 2
  confident: Int!        # confidence = 3
  verified: Int!         # confidence = 4
}

type TableConnectivity {
  table: Table!
  internalConnections: Int!
  externalConnections: Int!
  averageStrength: Float!
  averageConfidence: Float!
  mostCommonRelationType: RelationType
}

type NetworkMetrics {
  density: Float!        # Relation density
  clustering: Float!     # Clustering coefficient
  averagePathLength: Float!
  mostConnectedNodes: [NodeConnectivitySummary!]!
  isolatedNodes: Int!
}

# Optimal path finding
type OptimalPath {
  path: [PathNode!]!
  totalDistance: Float!
  averageStrength: Float!
  averageConfidence: Float!
  pathQuality: PathQuality!
  alternativePaths: [AlternativePath!]!
}

type PathNode {
  node: TableNode!
  relation: NodeRelation
  distanceFromSource: Int!
  strengthToNext: Int
  confidenceToNext: Int
}

type AlternativePath {
  path: [PathNode!]!
  totalDistance: Float!
  pathQuality: PathQuality!
  qualityDifference: Float!
}

# Node connectivity analysis
type NodeConnectivityResult {
  centralNode: TableNode!
  connectedNodes: [EnhancedConnectedNode!]!
  relationshipSummary: RelationshipSummary!
  networkPosition: NetworkPosition!
  influenceScore: Float!
}

type EnhancedConnectedNode {
  node: TableNode!
