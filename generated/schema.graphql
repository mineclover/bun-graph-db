# ========== types/common.graphql ==========
# Common types and interfaces used across domains

# Base interface for entities
interface Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Pagination input
input PaginationInput {
  limit: Int = 10
  offset: Int = 0
}

# Filter input
input FilterInput {
  search: String
  createdAfter: DateTime
  createdBefore: DateTime
}

# Sort input
enum SortDirection {
  ASC
  DESC
}

input SortInput {
  field: String!
  direction: SortDirection!
}

# Connection interface for pagination
interface Connection {
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Edge interface for connections
interface Edge {
  cursor: String!
}

# Operation result interface
interface OperationResult {
  success: Boolean!
  errors: [Error!]!
}


# ========== types/node.graphql ==========
# Node domain types

type TableNode implements Node {
  id: ID!
  content: String!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  table: Table!
  attributes: [NodeAttribute!]!
  outgoingRelations: [NodeRelation!]!
  incomingRelations: [NodeRelation!]!

  # Computed fields
  attributeCount: Int!
  relationCount: Int!

  # 그래프 탐색 필드들
  connectedNodes(
    depth: Int = 1
    direction: RelationDirection = BOTH
    relationTypes: [ID!]
  ): [ConnectedNode!]!

  shortestPath(targetNodeId: ID!, maxDepth: Int = 6): GraphPath

  neighborsByRelationType(relationTypeId: ID!): [TableNode!]!
}

type NodeAttribute {
  id: ID!
  value: String!
  attribute: Attribute!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Input types for node operations
input CreateNodeInput {
  content: String!
  tableId: ID!
  attributes: [NodeAttributeInput!]
}

input UpdateNodeInput {
  content: String
}

input NodeAttributeInput {
  attributeId: ID!
  value: String!
}

input SetNodeAttributeInput {
  nodeId: ID!
  attributeId: ID!
  value: String!
}

# Filter for nodes
input NodesFilter {
  search: String
  tableId: ID
  hasAttributes: Boolean
  createdAfter: DateTime
  createdBefore: DateTime
}

input SearchNodesFilter {
  search: String
  content: String
  tableId: ID!
  attributeFilters: [AttributeFilter!]
  relationFilters: [RelationFilter!]
}

input AttributeFilter {
  attributeId: ID!
  value: String!
  operator: FilterOperator = EQUALS
}

input RelationFilter {
  relationTypeId: ID!
  direction: RelationDirection!
  targetNodeId: ID
}

enum FilterOperator {
  EQUALS
  CONTAINS
  STARTS_WITH
  ENDS_WITH
  GREATER_THAN
  LESS_THAN
}

enum RelationDirection {
  INCOMING
  OUTGOING
  BOTH
}

# Pagination for nodes
input NodesPagination {
  limit: Int = 10
  offset: Int = 0
}

# Connection types for nodes
type NodesConnection implements Connection {
  nodes: [TableNode!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Operation result types for nodes
type CreateNodePayload implements OperationResult {
  success: Boolean!
  node: TableNode
  errors: [Error!]!
}

type UpdateNodePayload implements OperationResult {
  success: Boolean!
  node: TableNode
  errors: [Error!]!
}

type DeleteNodePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}

type SetNodeAttributePayload implements OperationResult {
  success: Boolean!
  nodeAttribute: NodeAttribute
  errors: [Error!]!
}

# 그래프 탐색 결과 타입들
type ConnectedNode {
  node: TableNode!
  depth: Int!
  path: [ID!]!
}

type GraphPath {
  nodes: [TableNode!]!
  relations: [NodeRelation!]!
  distance: Int!
}


# ========== types/table.graphql ==========
# Table domain types

type Table implements Node {
  id: ID!
  identifier: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  attributes: [Attribute!]!
  attributeTypes: [AttributeType!]!
  tableNodes: [TableNode!]!

  # Computed fields
  tableNodeCount: Int!
  attributeCount: Int!
}

# Input types for table operations
input CreateTableInput {
  identifier: String!
  description: String
}

input UpdateTableInput {
  description: String
}

# Filter for tables
input TablesFilter {
  search: String
  createdAfter: DateTime
  createdBefore: DateTime
  identifiers: [String!]
  hasNodes: Boolean
  nodeCountMin: Int
  nodeCountMax: Int
}

# Pagination for tables
input TablesPagination {
  limit: Int = 10
  offset: Int = 0
}

# Connection types for tables
type TablesConnection implements Connection {
  nodes: [Table!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type TableEdge implements Edge {
  cursor: String!
  node: Table!
}

# Operation result types for tables
type CreateTablePayload implements OperationResult {
  success: Boolean!
  table: Table
  errors: [Error!]!
}

type UpdateTablePayload implements OperationResult {
  success: Boolean!
  table: Table
  errors: [Error!]!
}

type DeleteTablePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
  deletedDependencies: TableDependencyInfo
}

# Table dependency information for deletion
type TableDependencyInfo {
  tableNodeCount: Int!
  attributeCount: Int!
  relationCount: Int!
}


# ========== types/attribute.graphql ==========
# Attribute domain types

type AttributeType implements Node {
  id: ID!
  identifier: String!
  name: String!
  description: String
  dataType: String!
  format: String
  constraints: JSON
  defaultValue: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Attribute implements Node {
  id: ID!
  identifier: String!
  name: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  attributeType: AttributeType!
  table: Table!
}

# Input types for attribute type operations
input CreateAttributeTypeInput {
  identifier: String!
  name: String!
  description: String
  dataType: String!
  format: String
  constraints: JSON
  defaultValue: String
}

input UpdateAttributeTypeInput {
  name: String
  description: String
  constraints: JSON
  defaultValue: String
}

# Input types for attribute operations
input CreateAttributeInput {
  identifier: String!
  name: String!
  description: String
  attributeTypeId: ID!
  tableId: ID!
}

input UpdateAttributeInput {
  name: String
  description: String
}

# Filter for attribute types
input AttributeTypesFilter {
  search: String
  dataType: String
  createdAfter: DateTime
  createdBefore: DateTime
}

# Filter for attributes
input AttributesFilter {
  search: String
  tableId: ID
  attributeTypeId: ID
  createdAfter: DateTime
  createdBefore: DateTime
}

# Connection types for attribute types
type AttributeTypesConnection implements Connection {
  attributeTypes: [AttributeType!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Connection types for attributes
type AttributesConnection implements Connection {
  attributes: [Attribute!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Operation result types for attribute types
type CreateAttributeTypePayload implements OperationResult {
  success: Boolean!
  attributeType: AttributeType
  errors: [Error!]!
}

type UpdateAttributeTypePayload implements OperationResult {
  success: Boolean!
  attributeType: AttributeType
  errors: [Error!]!
}

type DeleteAttributeTypePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}

# Operation result types for attributes
type CreateAttributePayload implements OperationResult {
  success: Boolean!
  attribute: Attribute
  errors: [Error!]!
}

type UpdateAttributePayload implements OperationResult {
  success: Boolean!
  attribute: Attribute
  errors: [Error!]!
}

type DeleteAttributePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}


# ========== types/relation.graphql ==========
# Relation domain types

type RelationType implements Node {
  id: ID!
  identifier: String!
  name: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NodeRelation implements Node {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  table: Table!
  sourceNode: TableNode!
  targetNode: TableNode!
  relationType: RelationType!
}

# Input types for relation type operations
input CreateRelationTypeInput {
  identifier: String!
  name: String!
  description: String
}

input UpdateRelationTypeInput {
  name: String
  description: String
}

# Input types for relation operations
input CreateRelationInput {
  tableId: ID!
  sourceNodeId: ID!
  targetNodeId: ID!
  relationTypeId: ID!
}

input UpdateRelationInput {
  relationTypeId: ID
  properties: JSON
  strength: Float
}

# Filters for relations
input NodeRelationsFilter {
  tableId: ID
  sourceNodeId: ID
  targetNodeId: ID
  relationTypeId: ID
  direction: RelationDirection
}

input SearchRelatedNodesFilter {
  sourceNodeId: ID!
  relationTypeIds: [ID!]
  direction: RelationDirection = OUTGOING
  maxDepth: Int = 1
}

# Graph analysis types
type NodePath {
  nodes: [TableNode!]!
  relations: [NodeRelation!]!
  length: Int!
  totalWeight: Float
}

input FindPathsInput {
  sourceNodeId: ID!
  targetNodeId: ID!
  maxDepth: Int = 3
  relationTypeIds: [ID!]
}

input DependencyChainInput {
  nodeId: ID!
  direction: RelationDirection = OUTGOING
  maxDepth: Int = 5
  relationTypeIds: [ID!]
}

# Connection types for relations
type NodeRelationsConnection implements Connection {
  nodes: [NodeRelation!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type RelatedNodesConnection implements Connection {
  nodes: [TableNode!]!
  relations: [NodeRelation!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Operation result types for relation types
type CreateRelationTypePayload implements OperationResult {
  success: Boolean!
  relationType: RelationType
  errors: [Error!]!
}

type UpdateRelationTypePayload implements OperationResult {
  success: Boolean!
  relationType: RelationType
  errors: [Error!]!
}

type DeleteRelationTypePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}

# Operation result types for relations
type CreateRelationPayload implements OperationResult {
  success: Boolean!
  relation: NodeRelation
  errors: [Error!]!
}

type UpdateRelationPayload implements OperationResult {
  success: Boolean!
  relation: NodeRelation
  errors: [Error!]!
}

type DeleteRelationPayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}


# ========== types/query-template.graphql ==========
# Query Template domain types

type QueryTemplate implements Node {
  id: ID!
  identifier: String!
  name: String!
  description: String
  query: String!
  queryName: [String!]!
  operationType: OperationType!
  variables: JSON
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  complexityScore: Int!
  usageCount: Int!
  lastUsedAt: DateTime
  avgExecutionTimeMs: Int!
  version: String!
  isActive: Boolean!
  tags: [String!]!
  createdBy: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Computed validation fields
  isValid: Boolean!
  validationErrors: [String!]!
}

enum OperationType {
  QUERY
  MUTATION
  SUBSCRIPTION
}

type QueryTemplateExecution {
  id: ID!
  templateId: ID!
  executedAt: DateTime!
  duration: Float!
  resultCount: Int!
  success: Boolean!
  errorMessage: String
}

# Input types for query template operations
input CreateQueryTemplateInput {
  identifier: String!
  name: String!
  description: String
  query: String!
  queryName: String
  variables: JSON
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  complexityScore: Int
  version: String
  tags: [String!]
  createdBy: String
}

input UpdateQueryTemplateInput {
  name: String
  description: String
  query: String
  queryName: String
  variables: JSON
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  complexityScore: Int
  version: String
  tags: [String!]
}

input ExecuteQueryTemplateInput {
  templateId: ID
  templateIdentifier: String
  variables: JSON
}

# Filter for query templates
input QueryTemplatesFilter {
  search: String
  isActive: Boolean
  createdBy: String
  createdAfter: DateTime
  createdBefore: DateTime
  templateType: String
  tags: [String!]
  tagMatchMode: TagMatchMode
  systemQueries: [String!]
  systemQueryMatchMode: TagMatchMode
  applicableToTable: String
  includeUniversal: Boolean
  usageCountMin: Int
  complexityMin: Int
  complexityMax: Int
}

enum TagMatchMode {
  ANY
  ALL
}

# Connection types for query templates
type QueryTemplatesConnection implements Connection {
  templates: [QueryTemplate!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Operation result types for query templates
type CreateQueryTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
}

type UpdateQueryTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
}

type UpdateTemplateQueryPayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
  previousQuery: String
}

type DeleteQueryTemplatePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}

type ExecuteQueryTemplatePayload {
  success: Boolean!
  data: JSON
  execution: QueryTemplateExecution
  errors: [Error!]!
}

type TemplateExecutionResult {
  success: Boolean!
  data: JSON
  errors: [TemplateExecutionError!]
  metadata: TemplateExecutionMetadata!
}

type TemplateExecutionError {
  message: String!
  locations: [GraphQLLocation!]
  path: [String!]
  code: String
}

type GraphQLLocation {
  line: Int!
  column: Int!
}

type TemplateExecutionMetadata {
  templateId: ID!
  templateName: String!
  complexityScore: Int!
  estimatedTokens: Int
  version: String!
  executionTime: Int!
}

# Import/Export Types
type ExportTemplatePayload implements OperationResult {
  success: Boolean!
  exportData: String
  filename: String
  errors: [Error!]!
}

type ImportTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
  warnings: [String!]
}

# Table dependency specific types
input FindTemplatesByTableInput {
  tableName: String!
  includeUniversal: Boolean = true
}

type TableDependencyTemplateResult {
  tableName: String!
  templates: [QueryTemplate!]!
  totalCount: Int!
}


