}

type NodeDeletedEvent {
  id: ID!
  tableId: ID!
  content: String!
  deletedAt: DateTime!
}


# ========== schemas/schema-export-import.graphql ==========
# Schema Export/Import type definitions

# Export options
input SchemaExportOptions {
  includeData: Boolean = true
  includeRelations: Boolean = true
  format: String = "json"
  compression: Boolean = false
}

# Export result metadata
type ExportMetadata {
  exportedAt: String!
  version: String!
  source: String!
  options: JSON
  checksum: String
}

# Exported table structure
type ExportedTable {
  id: String!
  identifier: String!
  description: String
  metadata: JSON
  createdAt: String!
  updatedAt: String!
  attributes: [ExportedAttribute!]!
  nodes: [ExportedNode!]!
  relations: [ExportedRelation!]!
  statistics: ExportTableStatistics!
}

type ExportTableStatistics {
  nodeCount: Int!
  attributeCount: Int!
  relationCount: Int!
}

# Exported attribute structure
type ExportedAttribute {
  id: String!
  identifier: String!
  name: String!
  description: String
  attributeType: ExportedAttributeType!
  isRequired: Boolean!
  defaultValue: JSON
  createdAt: String!
  updatedAt: String!
}

type ExportedAttributeType {
  id: String!
  identifier: String!
  name: String!
  dataType: String!
  allowedValues: [String!]
  constraints: JSON
}

# Exported node structure
type ExportedNode {
  id: String!
  content: String!
  title: String
  description: String
  attributes: JSON
  createdAt: String!
  updatedAt: String!
}

# Exported relation structure
type ExportedRelation {
  id: String!
  sourceNodeId: String!
  targetNodeId: String!
  relationType: ExportedRelationType!
  properties: JSON
  strength: Float
  createdAt: String!
  updatedAt: String!
}

type ExportedRelationType {
  id: String!
  identifier: String!
  name: String!
  description: String
}

# Global types in export
type ExportedGlobalRelationType {
  id: String!
  identifier: String!
  name: String!
  description: String
  metadata: JSON
  createdAt: String!
  updatedAt: String!
}

type ExportedGlobalAttributeType {
  id: String!
  identifier: String!
  name: String!
  description: String
  dataType: String!
  allowedValues: [String!]
  constraints: JSON
  createdAt: String!
  updatedAt: String!
}

# Export statistics
type ExportStatistics {
  totalTables: Int!
  totalNodes: Int!
  totalRelations: Int!
  totalAttributes: Int!
  exportSize: String!
}

# Complete export result
type SchemaExportResult {
  metadata: ExportMetadata!
  tables: [ExportedTable!]!
  globalRelationTypes: [ExportedGlobalRelationType!]!
  globalAttributeTypes: [ExportedGlobalAttributeType!]!
  statistics: ExportStatistics!
}

# Import options
input SchemaImportOptions {
  overwriteExisting: Boolean = false
  skipDuplicates: Boolean = true
  validateData: Boolean = true
  dryRun: Boolean = false
  conflictResolution: String = "skip"
}

# Import statistics
type ImportStatistics {
  tablesImported: Int!
  nodesImported: Int!
  relationsImported: Int!
  attributesImported: Int!
  attributeTypesImported: Int!
  relationTypesImported: Int!
  skipped: Int!
  errors: Int!
}

# Import error/warning
type ImportIssue {
  type: String!
  message: String!
  item: JSON
}

# Import result
type ImportResult {
  success: Boolean!
  statistics: ImportStatistics!
  errors: [ImportIssue!]!
  warnings: [ImportIssue!]!
  executionTime: Float!
  importedAt: String!
}

extend type Query {
  # Export single table
  exportTable(tableId: String!, options: SchemaExportOptions): SchemaExportResult!

  # Export all tables
  exportAllTables(options: SchemaExportOptions): SchemaExportResult!
}

extend type Mutation {
  # Import schema data
  importSchema(exportData: JSON!, options: SchemaImportOptions): ImportResult!
}


# ========== schemas/attribute.graphql ==========
# Attribute type definitions based on SQLite schema
type AttributeType {
  id: ID!
  identifier: String!
  jsonType: String!
  format: String
  description: String
  validationSchema: JSON
  referenceConfig: JSON
  defaultValue: JSON
  examples: [JSON!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Attribute {
  id: ID!
  identifier: String!
  attributeType: AttributeType!
  table: Table!
  description: String
  isRequired: Boolean!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Input types
input CreateAttributeTypeInput {
  identifier: String!
  jsonType: String!
  format: String
  description: String
  validationSchema: JSON
  referenceConfig: JSON
  defaultValue: JSON
  examples: [JSON!]
}

input CreateAttributeInput {
  tableId: ID!
  identifier: String!
  attributeTypeId: ID!
  description: String
  isRequired: Boolean = false
  metadata: JSON
}

input UpdateAttributeInput {
  description: String
  isRequired: Boolean
  metadata: JSON
}

# Payload types
type CreateAttributeTypePayload {
  attributeType: AttributeType
  errors: [Error!]!
}

type CreateAttributePayload {
  attribute: Attribute
  errors: [Error!]!
}

type UpdateAttributePayload {
  attribute: Attribute
  errors: [Error!]!
}

type DeleteAttributePayload {
  success: Boolean!
  errors: [Error!]!
}

# JSON scalar for arbitrary JSON data
scalar JSON

extend type Query {
  # Attribute types
  attributeType(id: ID!): AttributeType
  attributeTypeByIdentifier(identifier: String!): AttributeType
  attributeTypes: [AttributeType!]!

  # Attributes
  attribute(id: ID!): Attribute
  attributes(tableId: ID!): [Attribute!]!
}

extend type Mutation {
  # Attribute type management
  createAttributeType(input: CreateAttributeTypeInput!): CreateAttributeTypePayload!
  updateAttributeType(id: ID!, input: CreateAttributeTypeInput!): CreateAttributeTypePayload!
  deleteAttributeType(id: ID!): DeleteAttributePayload!

  # Attribute management
  createAttribute(input: CreateAttributeInput!): CreateAttributePayload!
  updateAttribute(id: ID!, input: UpdateAttributeInput!): UpdateAttributePayload!
  deleteAttribute(id: ID!): DeleteAttributePayload!
}


# ========== schemas/query-template.graphql ==========
# Query Template GraphQL Schema

type Query {
  # 템플릿 검색
  searchTemplates(input: SearchTemplatesInput!): [QueryTemplate!]!

  # 단일 템플릿 조회
  getTemplate(id: ID!): QueryTemplate
  getTemplateByIdentifier(identifier: String!): QueryTemplate

  # 인기 템플릿 조회
  getPopularTemplates(limit: Int = 10): [QueryTemplate!]!

  # 템플릿 기반 쿼리 실행
  executeTemplate(input: ExecuteTemplateInput!): JSON!
}

type Mutation {
  # 템플릿 관리
  createTemplate(input: CreateTemplateInput!): QueryTemplate!
  updateTemplate(id: ID!, input: UpdateTemplateInput!): QueryTemplate!
  deleteTemplate(id: ID!): Boolean!

  # 템플릿 상태 관리
  activateTemplate(id: ID!): QueryTemplate!
  deactivateTemplate(id: ID!): QueryTemplate!

  # 템플릿 기반 쿼리 실행
  executeTemplate(input: ExecuteTemplateInput!): JSON!
}

type QueryTemplate {
  id: ID!
  identifier: String!
  name: String!
  description: String
  queryText: String!
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  templateType: TemplateType!
  complexityScore: Int!
  usageCount: Int!
  version: String!
  isActive: Boolean!
  tags: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum TemplateType {
  QUERY
  MUTATION
  SUBSCRIPTION
}

input SearchTemplatesInput {
  # 태그 기반 검색
  tags: [String!]
  tagMatchMode: TagMatchMode

  # 테이블 필터링
  applicableToTable: String
  includeUniversal: Boolean = true

  # 타입 필터링
  templateType: TemplateType

  # 상태 필터링
  isActive: Boolean

  # 정렬
  orderBy: TemplateOrderBy
  orderDirection: OrderDirection

  # 페이징
  limit: Int = 20
  offset: Int = 0
}

enum TagMatchMode {
  ANY # OR 조건
  ALL # AND 조건
}

enum TemplateOrderBy {
  USAGE_COUNT
  CREATED_AT
  UPDATED_AT
  NAME
}

enum OrderDirection {
  ASC
  DESC
}

input CreateTemplateInput {
  identifier: String!
  name: String!
  description: String
  queryText: String!
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  templateType: TemplateType = QUERY
  complexityScore: Int = 1
  tags: [String!]!
}

input UpdateTemplateInput {
  name: String
  description: String
  queryText: String
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  templateType: TemplateType
  complexityScore: Int
  tags: [String!]
  version: String
  isActive: Boolean
}

# 템플릿 실행 관련
input ExecuteTemplateInput {
  # 템플릿 식별 (둘 중 하나 필수)
  templateId: ID
  templateIdentifier: String

  # 변수
  variables: JSON

  # 실행 옵션
  trackUsage: Boolean = true
  validateVariables: Boolean = true
}


# ========== schemas/node.graphql ==========
# Node type definitions based on SQLite schema
type Node {
  id: ID!
  table: Table!
  content: String!
  title: String
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Attribute values
  attributes: [NodeAttribute!]!

  # Relations
  outgoingRelations: [NodeRelation!]!
  incomingRelations: [NodeRelation!]!

  # Computed fields
  attributeCount: Int!
  relationCount: Int!
}

type NodeAttribute {
  id: ID!
  node: Node!
  attribute: Attribute!
  value: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NodeRelation {
  id: ID!
  table: Table!
  sourceNode: Node
  sourceExternalId: String!
  targetNode: Node
  targetExternalId: String!
  relationType: RelationType!
  properties: JSON
  strength: Int!
  confidence: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type RelationType {
  id: ID!
  identifier: String!
  description: String
  category: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Input types
input CreateNodeInput {
  tableId: ID!
  content: String!
  title: String
  description: String
  attributes: [NodeAttributeInput!]
}

input UpdateNodeInput {
  content: String
  title: String
  description: String
}

input NodeAttributeInput {
  attributeId: ID!
  value: JSON!
}

input CreateRelationInput {
  tableId: ID!
  sourceNodeId: ID
  sourceExternalId: String
  targetNodeId: ID
  targetExternalId: String
  relationTypeId: ID!
  properties: JSON
  strength: Int = 1
  confidence: Int = 1
}

input CreateRelationTypeInput {
  identifier: String!
  description: String
  category: String
}

input SearchNodesInput {
  tableId: ID!
  query: String
  limit: Int
  offset: Int
  sortBy: [SortInput!]
}

input SortInput {
  field: String!
  direction: SortDirection!
}

enum SortDirection {
  ASC
  DESC
}

# Legacy search filter (keeping for backward compatibility)
input NodeSearchFilter {
  tableId: ID
  content: String
  title: String
  hasAttributes: [ID!]
  attributeValues: [AttributeValueFilter!]
  createdAfter: DateTime
  createdBefore: DateTime
}

input AttributeValueFilter {
  attributeId: ID!
  operator: ComparisonOperator!
  value: JSON!
}

enum ComparisonOperator {
  EQUALS
  NOT_EQUALS
  CONTAINS
  STARTS_WITH
  ENDS_WITH
  GREATER_THAN
  LESS_THAN
  IN
  NOT_IN
}

# Payload types
type CreateNodePayload {
  node: Node
  errors: [Error!]!
}

type UpdateNodePayload {
  node: Node
  errors: [Error!]!
}

type DeleteNodePayload {
  success: Boolean!
  errors: [Error!]!
}

type CreateRelationPayload {
  relation: NodeRelation
  errors: [Error!]!
}

type CreateRelationTypePayload {
  relationType: RelationType
  errors: [Error!]!
}

# Connection types
type NodesConnection {
  nodes: [Node!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type SearchNodesResult {
  nodes: [Node!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  query: SearchQueryInfo!
}

type SearchQueryInfo {
  originalQuery: String!
  parsedConditions: JSON!
}

extend type Query {
  # Single node queries
  node(id: ID!): Node
  nodeByContent(tableId: ID!, content: String!): Node

  # Multiple node queries
  nodes(tableId: ID!, pagination: TablesPagination): NodesConnection!

  # Advanced search with query parsing
  searchNodes(input: SearchNodesInput!): SearchNodesResult!

  # Relations
  nodeRelation(id: ID!): NodeRelation
  nodeRelations(tableId: ID!): [NodeRelation!]!
  relationTypes: [RelationType!]!
  relationType(id: ID!): RelationType
}

extend type Mutation {
  # Node management
  createNode(input: CreateNodeInput!): CreateNodePayload!
  updateNode(id: ID!, input: UpdateNodeInput!): UpdateNodePayload!
  deleteNode(id: ID!): DeleteNodePayload!

  # Node attribute management
  setNodeAttribute(nodeId: ID!, attributeId: ID!, value: JSON!): UpdateNodePayload!
  removeNodeAttribute(nodeId: ID!, attributeId: ID!): UpdateNodePayload!

  # Relation management
  createRelation(input: CreateRelationInput!): CreateRelationPayload!
  deleteRelation(id: ID!): DeleteNodePayload!

  # Relation type management
  createRelationType(input: CreateRelationTypeInput!): CreateRelationTypePayload!
}
