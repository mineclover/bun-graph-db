  strengthEvolution: [StrengthEvolution!]!
  weakRelations: [WeakRelation!]!
  strongRelations: [StrongRelation!]!
}

type StrengthStats {
  averageStrength: Float!
  strengthVariance: Float!
  distributionSkew: Float!
  reliabilityScore: Float!
}

type StrengthByType {
  relationType: RelationType!
  averageStrength: Float!
  strengthRange: IntRange!
  reliability: Float!
}

type StrengthEvolution {
  timeWindow: String!
  averageStrength: Float!
  trend: Trend!
}

# External reference types
type ExternalReferenceResult {
  resolvedReferences: [ResolvedReference!]!
  unresolvedReferences: [UnresolvedReference!]!
  resolutionStats: ResolutionStats!
}

type ResolvedReference {
  relation: NodeRelation!
  externalId: String!
