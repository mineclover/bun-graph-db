name: Node 26 Validation Lanes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * 1"

concurrency:
  group: node-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.21.0"
  # Temporary authority for the local file: dependency. Replace this checkout
  # boundary with an exact package version once the contract is published.
  OA_SDK_CONTRACT_REF: "a8e9a60434365fc8e98be12996d671b855b1e4d6"
  NODE_ENV: test

defaults:
  run:
    shell: bash
    working-directory: oa-sdk/references/bun-graph-db

jobs:
  static:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout OA SDK parent layout
        uses: actions/checkout@v4
        with:
          repository: mineclover/oa-sdk
          ref: ${{ env.OA_SDK_CONTRACT_REF }}
          path: oa-sdk
          sparse-checkout: packages/openapi-projection-contract

      - name: Checkout bun-graph-db
        uses: actions/checkout@v4
        with:
          path: oa-sdk/references/bun-graph-db

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: oa-sdk/references/bun-graph-db/pnpm-lock.yaml

      - name: Verify intentional parent-layout dependency
        run: |
          contract_manifest="../../packages/openapi-projection-contract/package.json"
          if [[ ! -f "$contract_manifest" ]]; then
            echo "::error::bun-graph-db requires the OA SDK parent layout: <oa-sdk>/references/bun-graph-db plus <oa-sdk>/packages/openapi-projection-contract. A standalone checkout cannot satisfy the intentional file: dependency."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local projection contract
        run: PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir ../../packages/openapi-projection-contract run build

      - name: Run static gate
        run: pnpm run check:static

  lane-audit:
    name: Lane ownership audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout OA SDK parent layout
        uses: actions/checkout@v4
        with:
          repository: mineclover/oa-sdk
          ref: ${{ env.OA_SDK_CONTRACT_REF }}
          path: oa-sdk
          sparse-checkout: packages/openapi-projection-contract

      - name: Checkout bun-graph-db
        uses: actions/checkout@v4
        with:
          path: oa-sdk/references/bun-graph-db

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: oa-sdk/references/bun-graph-db/pnpm-lock.yaml

      - name: Verify intentional parent-layout dependency
        run: |
          contract_manifest="../../packages/openapi-projection-contract/package.json"
          if [[ ! -f "$contract_manifest" ]]; then
            echo "::error::bun-graph-db requires the OA SDK parent layout: <oa-sdk>/references/bun-graph-db plus <oa-sdk>/packages/openapi-projection-contract. A standalone checkout cannot satisfy the intentional file: dependency."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit every test file has one lane
        run: pnpm run test:lanes:audit

  unit-tests:
    name: Parallel-safe tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static, lane-audit]

    steps:
      - name: Checkout OA SDK parent layout
        uses: actions/checkout@v4
        with:
          repository: mineclover/oa-sdk
          ref: ${{ env.OA_SDK_CONTRACT_REF }}
          path: oa-sdk
          sparse-checkout: packages/openapi-projection-contract

      - name: Checkout bun-graph-db
        uses: actions/checkout@v4
        with:
          path: oa-sdk/references/bun-graph-db

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: oa-sdk/references/bun-graph-db/pnpm-lock.yaml

      - name: Verify intentional parent-layout dependency
        run: |
          contract_manifest="../../packages/openapi-projection-contract/package.json"
          if [[ ! -f "$contract_manifest" ]]; then
            echo "::error::bun-graph-db requires the OA SDK parent layout: <oa-sdk>/references/bun-graph-db plus <oa-sdk>/packages/openapi-projection-contract. A standalone checkout cannot satisfy the intentional file: dependency."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local projection contract
        run: PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir ../../packages/openapi-projection-contract run build

      - name: Run parallel-safe lane
        run: pnpm run test:parallel-safe

  serial-tests:
    name: Serial tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static, lane-audit]

    steps:
      - name: Checkout OA SDK parent layout
        uses: actions/checkout@v4
        with:
          repository: mineclover/oa-sdk
          ref: ${{ env.OA_SDK_CONTRACT_REF }}
          path: oa-sdk
          sparse-checkout: packages/openapi-projection-contract

      - name: Checkout bun-graph-db
        uses: actions/checkout@v4
        with:
          path: oa-sdk/references/bun-graph-db

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: oa-sdk/references/bun-graph-db/pnpm-lock.yaml

      - name: Verify intentional parent-layout dependency
        run: |
          contract_manifest="../../packages/openapi-projection-contract/package.json"
          if [[ ! -f "$contract_manifest" ]]; then
            echo "::error::bun-graph-db requires the OA SDK parent layout: <oa-sdk>/references/bun-graph-db plus <oa-sdk>/packages/openapi-projection-contract. A standalone checkout cannot satisfy the intentional file: dependency."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local projection contract
        run: PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir ../../packages/openapi-projection-contract run build

      - name: Run serial-only lane
        run: pnpm run test:serial-only

  projection-contract:
    name: Projection artifact contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static]

    steps:
      - name: Checkout OA SDK parent layout
        uses: actions/checkout@v4
        with:
          repository: mineclover/oa-sdk
          ref: ${{ env.OA_SDK_CONTRACT_REF }}
          path: oa-sdk
          sparse-checkout: packages/openapi-projection-contract

      - name: Checkout bun-graph-db
        uses: actions/checkout@v4
        with:
          path: oa-sdk/references/bun-graph-db

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: oa-sdk/references/bun-graph-db/pnpm-lock.yaml

      - name: Verify intentional parent-layout dependency
        run: |
          contract_manifest="../../packages/openapi-projection-contract/package.json"
          if [[ ! -f "$contract_manifest" ]]; then
            echo "::error::bun-graph-db requires the OA SDK parent layout: <oa-sdk>/references/bun-graph-db plus <oa-sdk>/packages/openapi-projection-contract. A standalone checkout cannot satisfy the intentional file: dependency."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local projection contract
        run: PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir ../../packages/openapi-projection-contract run build

      - name: Test projection artifact contract
        run: pnpm run projection:check

      - name: Verify deterministic projection export
        run: |
          first="$RUNNER_TEMP/oa-sdk-projection-first"
          second="$RUNNER_TEMP/oa-sdk-projection-second"
          pnpm run projection:export -- --out "$first"
          pnpm run projection:export -- --out "$second"
          diff -ru "$first" "$second"

      - name: Upload deterministic projection evidence
        uses: actions/upload-artifact@v4
        with:
          name: bun-graph-db-oa-sdk-projection-${{ github.sha }}
          path: ${{ runner.temp }}/oa-sdk-projection-first
          if-no-files-found: error
          retention-days: 14

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests, serial-tests, projection-contract]

    steps:
      - name: Checkout OA SDK parent layout
        uses: actions/checkout@v4
        with:
          repository: mineclover/oa-sdk
          ref: ${{ env.OA_SDK_CONTRACT_REF }}
          path: oa-sdk
          sparse-checkout: packages/openapi-projection-contract

      - name: Checkout bun-graph-db
        uses: actions/checkout@v4
        with:
          path: oa-sdk/references/bun-graph-db

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: oa-sdk/references/bun-graph-db/pnpm-lock.yaml

      - name: Verify intentional parent-layout dependency
        run: |
          contract_manifest="../../packages/openapi-projection-contract/package.json"
          if [[ ! -f "$contract_manifest" ]]; then
            echo "::error::bun-graph-db requires the OA SDK parent layout: <oa-sdk>/references/bun-graph-db plus <oa-sdk>/packages/openapi-projection-contract. A standalone checkout cannot satisfy the intentional file: dependency."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local projection contract
        run: PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir ../../packages/openapi-projection-contract run build

      - name: Run end-to-end lane
        run: pnpm run test:e2e

  stress-tests:
    name: Scheduled stress tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [e2e-tests]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.e2e-tests.result == 'success' }}

    steps:
      - name: Checkout OA SDK parent layout
        uses: actions/checkout@v4
        with:
          repository: mineclover/oa-sdk
          ref: ${{ env.OA_SDK_CONTRACT_REF }}
          path: oa-sdk
          sparse-checkout: packages/openapi-projection-contract

      - name: Checkout bun-graph-db
        uses: actions/checkout@v4
        with:
          path: oa-sdk/references/bun-graph-db

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: oa-sdk/references/bun-graph-db/pnpm-lock.yaml

      - name: Verify intentional parent-layout dependency
        run: |
          contract_manifest="../../packages/openapi-projection-contract/package.json"
          if [[ ! -f "$contract_manifest" ]]; then
            echo "::error::bun-graph-db requires the OA SDK parent layout: <oa-sdk>/references/bun-graph-db plus <oa-sdk>/packages/openapi-projection-contract. A standalone checkout cannot satisfy the intentional file: dependency."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local projection contract
        run: PATH="$PWD/node_modules/.bin:$PATH" pnpm --dir ../../packages/openapi-projection-contract run build

      - name: Run stress lane
        run: pnpm run test:stress

      - name: Capture advisory hot-path benchmark
        if: always()
        continue-on-error: true
        run: pnpm run benchmark:hotpaths -- --output "$RUNNER_TEMP/bun-graph-db-hotpaths.json"

      - name: Upload hot-path benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-graph-db-hotpaths-${{ github.sha }}
          path: ${{ runner.temp }}/bun-graph-db-hotpaths.json
          if-no-files-found: warn
          retention-days: 14

  test-summary:
    name: Test summary
    runs-on: ubuntu-latest
    needs: [static, lane-audit, unit-tests, serial-tests, projection-contract, e2e-tests, stress-tests]
    if: always()

    steps:
      - name: Publish lane results
        working-directory: .
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          LANE_AUDIT_RESULT: ${{ needs.lane-audit.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          SERIAL_RESULT: ${{ needs.serial-tests.result }}
          PROJECTION_RESULT: ${{ needs.projection-contract.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          STRESS_RESULT: ${{ needs.stress-tests.result }}
        run: |
          {
            echo "## Node 26 validation lanes"
            echo
            echo "| Lane | Result |"
            echo "| --- | --- |"
            echo "| Static | $STATIC_RESULT |"
            echo "| Lane audit | $LANE_AUDIT_RESULT |"
            echo "| Parallel-safe | $UNIT_RESULT |"
            echo "| Serial-only | $SERIAL_RESULT |"
            echo "| Projection contract | $PROJECTION_RESULT |"
            echo "| End-to-end | $E2E_RESULT |"
            echo "| Stress (schedule/manual only) | $STRESS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          required_results=(
            "$STATIC_RESULT"
            "$LANE_AUDIT_RESULT"
            "$UNIT_RESULT"
            "$SERIAL_RESULT"
            "$PROJECTION_RESULT"
            "$E2E_RESULT"
          )
          for result in "${required_results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required validation lane did not succeed."
              exit 1
            fi
          done
          if [[ "$STRESS_RESULT" != "success" && "$STRESS_RESULT" != "skipped" ]]; then
            echo "The stress lane did not succeed."
            exit 1
          fi
