name: Template Quality Gate

on:
  push:
    paths:
      - 'demo/templates/**/*.json'
      - 'src/graphql/**/*.ts'
      - 'scripts/template-*.ts'
  pull_request:
    paths:
      - 'demo/templates/**/*.json'
      - 'src/graphql/**/*.ts'

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
        
      - name: Start GraphQL server
        run: |
          bun run dev &
          sleep 10  # 서버 시작 대기
          
      - name: Validate changed templates
        run: |
          # 변경된 템플릿 파일들 추출
          CHANGED_TEMPLATES=$(git diff --name-only HEAD~1 -- demo/templates/*.json | \
            sed 's|demo/templates/||g' | \
            sed 's|_v[0-9-]*\.json||g' | \
            sort -u)
          
          if [ -n "$CHANGED_TEMPLATES" ]; then
            echo "🔍 변경된 템플릿 검증: $CHANGED_TEMPLATES"
            for template in $CHANGED_TEMPLATES; do
              bun run template:validate-single "$template" || exit 1
            done
          else
            echo "ℹ️ 변경된 템플릿 없음"
          fi
          
      - name: Full validation on main branch
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🔄 전체 템플릿 검증 (main 브랜치)"
          bun run template:validate-batch \
            search-templates-advanced \
            list-nodes-by-table \
            get-table-schema \
            list-tables-with-pagination
            
  template-security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Template security scan
        run: |
          # 템플릿에서 보안 위험 패턴 검사
          echo "🛡️ 보안 스캔 실행"
          
          # SQL Injection 패턴 검사
          if grep -r "DROP\|DELETE\|TRUNCATE" demo/templates/; then
            echo "❌ 위험한 SQL 패턴 감지"
            exit 1
          fi
          
          # GraphQL Introspection 남용 검사
          if grep -r "__schema\|__type" demo/templates/ | grep -v "template-validator"; then
            echo "⚠️ Introspection 쿼리 감지 - 검토 필요"
          fi
          
          echo "✅ 보안 스캔 통과"