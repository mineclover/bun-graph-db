# Table domain types

type Table implements Node {
  id: ID!
  identifier: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relationships
  attributes: [Attribute!]!
  attributeTypes: [AttributeType!]!
  tableNodes: [TableNode!]!

  # Computed fields
  tableNodeCount: Int!
  attributeCount: Int!

  # AI-friendly metadata
  aiMetadata: AIMetadata

  # MCP setup command for Claude Code integration
  mcpCommand: String!
}

# Input types for table operations
input CreateTableInput {
  identifier: String!
  description: String
}

input UpdateTableInput {
  description: String
}

# Filter for tables
input TablesFilter {
  search: String
  createdAfter: DateTime
  createdBefore: DateTime
  identifiers: [String!]
  hasNodes: Boolean
  nodeCountMin: Int
  nodeCountMax: Int
}

# Pagination for tables
input TablesPagination {
  limit: Int = 10
  offset: Int = 0
}

# Connection types for tables
type TablesConnection implements Connection {
  nodes: [Table!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type TableEdge implements Edge {
  cursor: String!
  node: Table!
}

# Operation result types for tables
type CreateTablePayload implements OperationResult {
  success: Boolean!
  table: Table
  errors: [Error!]!
}

type UpdateTablePayload implements OperationResult {
  success: Boolean!
  table: Table
  errors: [Error!]!
}

type DeleteTablePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
  deletedDependencies: TableDependencyInfo
}

# Table dependency information for deletion
type TableDependencyInfo {
  tableNodeCount: Int!
  attributeCount: Int!
  relationCount: Int!
}

# Comprehensive table documentation
type TableDocumentation {
  table: Table!

  # Schema information
  schema: TableSchema!

  # Documentation system integration
  docs: TableDocsInfo

  # Sample data
  sampleNodes: [TableNode!]

  # Related templates
  relatedTemplates: [QueryTemplate!]

  # Relationship information
  relationships: TableRelationshipInfo

  # Usage statistics
  usageStats: TableUsageStats

  # Documentation information
  documentation: TableDocumentationInfo

  # AI-friendly metadata
  aiMetadata: AIMetadata

  # Generated timestamp
  generatedAt: DateTime!
}

type TableSchema {
  attributes: [Attribute!]!
  attributeCount: Int!
}

type AttributeDocumentation {
  attribute: Attribute!
  attributeType: AttributeType!
  sampleValues: [String!]
  valueCount: Int!
  nullCount: Int!
}

type TableRelationshipInfo {
  incomingRelations: [RelationshipSummary!]!
  outgoingRelations: [RelationshipSummary!]!
  relatedTables: [Table!]!
}

type RelationshipSummary {
  relationshipType: String!
  count: Int!
  relatedTable: Table!
}

type TableUsageStats {
  totalNodes: Int!
  recentlyCreatedNodes: Int!
  frequentlyAccessedAttributes: [String!]!
  averageAttributeUsage: Float!
}

type TableUsageExample {
  category: String!
  title: String!
  description: String!
  exampleQuery: String
  exampleMutation: String
}

# Documentation system types for table documentation
type TableDocsInfo {
  usage: Doc
  guide: Doc
  example: Doc
  spec: Doc
  general: Doc
  allDocs: [Doc!]!
  docCount: Int!
}

# Table documentation metadata
type TableDocumentationInfo {
  description: String!
  usageExamples: [String!]!
  bestPractices: [String!]!
}

# AI-friendly metadata types
type AIMetadata {
  schemaInfo: AISchemaInfo!
  usagePatterns: AIUsagePatterns!
  sampleData: AISampleData
}

type AISchemaInfo {
  dataTypes: JSON!
  requiredFields: [String!]!
  searchableFields: [String!]!
  relationshipCapabilities: [String!]!
}

type AIUsagePatterns {
  commonQueries: [AICommonQuery!]!
  templateRecommendations: [AITemplateRecommendation!]!
  queryComplexity: AIQueryComplexity!
}

type AICommonQuery {
  pattern: String!
  description: String!
  example: String!
}

type AITemplateRecommendation {
  templateId: String!
  useCase: String!
}

type AISampleData {
  nodes: [AISampleNode!]!
  relationships: [AISampleRelationship!]!
}

type AISampleNode {
  id: String!
  content: String!
  attributes: JSON!
}

type AISampleRelationship {
  from: String!
  to: String!
  type: String!
}

enum AIQueryComplexity {
  simple
  moderate
  complex
}
