  errors: [Error!]!
}

type UpdateNodePayload implements OperationResult {
  success: Boolean!
  node: TableNode
  errors: [Error!]!
}

type DeleteNodePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}

type SetNodeAttributePayload implements OperationResult {
  success: Boolean!
  nodeAttribute: NodeAttribute
  errors: [Error!]!
}

type SetNodeAttributesPayload implements OperationResult {
  success: Boolean!
  nodeAttributes: [NodeAttribute!]!
  errors: [Error!]!
}

type SetNodeAttributesByIdentifierPayload implements OperationResult {
  success: Boolean!
  nodeAttributes: [NodeAttribute!]!
  errors: [Error!]!
}

type CreateNodeWithAttributesPayload implements OperationResult {
  success: Boolean!
  node: TableNode
  attributes: [NodeAttribute!]!
  errors: [Error!]!
}

type CreatePersonNodePayload implements OperationResult {
  success: Boolean!
  node: TableNode
  attributes: [NodeAttribute!]!
  errors: [Error!]!
}

# 그래프 탐색 결과 타입들
type ConnectedNode {
  node: TableNode!
  depth: Int!
  path: [ID!]!
}

type GraphPath {
  nodes: [TableNode!]!
  relations: [NodeRelation!]!
  distance: Int!
}

# Custom Sort Function Types

"""
Custom sort function definition
Represents a user-defined sorting function with metadata and examples
"""
type CustomSortFunction {
  "Unique identifier for the function"
  id: String!

  "Human-readable name"
  name: String!

  "Description of what the function does"
  description: String!

  "Data types this function can handle"
  supportedDataTypes: [SortDataType!]!

  "Priority for automatic selection (higher = preferred)"
  priority: Int!

  "Function version"
  version: String!

  "Optional author information"
  author: String

  "Tags for categorization and discovery"
  tags: [String!]!

  "Parameter definitions"
  parameters: [CustomSortParameter!]!

  "Usage examples"
  examples: [CustomSortExample!]!

  "Creation timestamp"
  createdAt: DateTime!

  "Last updated timestamp"
  updatedAt: DateTime!
}

"""
Parameter definition for custom sort functions
"""
type CustomSortParameter {
  "Parameter name"
  name: String!

  "Parameter data type"
  type: CustomSortParameterType!

  "Whether parameter is required"
  required: Boolean!

  "Parameter description"
  description: String!

  "Default value (JSON string)"
  defaultValue: String

  "Validation rules"
  validation: CustomSortParameterValidation
}

"""
Parameter validation rules
"""
type CustomSortParameterValidation {
  "Minimum value for numeric parameters"
  min: Float

  "Maximum value for numeric parameters"
  max: Float

  "Regex pattern for string validation"
  pattern: String

  "List of allowed values"
  allowedValues: [String!]
}

"""
Usage example for custom sort functions
"""
type CustomSortExample {
  "Example title"
  title: String!

  "Example description"
  description: String!

  "Field name used in example"
  field: String!

  "Sort direction in example"
  direction: SortDirection!

  "Parameters used in example (JSON string)"
  parameters: String

  "Expected SQL output"
  expectedSql: String!
}

"""
Custom sort function usage statistics
"""
type CustomSortFunctionStats {
  "Function identifier"
  functionId: String!

  "Total number of calls"
  callCount: Int!

  "Average execution time in milliseconds"
  averageExecutionTime: Float!

  "Last usage timestamp"
  lastUsed: DateTime!

  "Number of errors encountered"
  errorCount: Int!

  "Success rate percentage"
  successRate: Float!
}

"""
Parameter types for custom sort functions
"""
enum CustomSortParameterType {
  STRING
  NUMBER
  BOOLEAN
  ARRAY
  OBJECT
}
