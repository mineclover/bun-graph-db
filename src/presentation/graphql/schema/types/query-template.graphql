# Query Template domain types

type QueryTemplate implements Node {
  id: ID!
  identifier: String!
  name: String!
  description: String
  query: String!
  variables: JSON
  isActive: Boolean!
  usageCount: Int!
  createdBy: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Validation
  isValid: Boolean!
  validationErrors: [String!]!
}

type QueryTemplateExecution {
  id: ID!
  templateId: ID!
  executedAt: DateTime!
  duration: Float!
  resultCount: Int!
  success: Boolean!
  errorMessage: String
}

# Input types for query template operations
input CreateQueryTemplateInput {
  identifier: String!
  name: String!
  description: String
  query: String!
  variables: JSON
  createdBy: String
}

input UpdateQueryTemplateInput {
  name: String
  description: String
  query: String
  variables: JSON
}

input ExecuteQueryTemplateInput {
  templateId: ID
  templateIdentifier: String
  variables: JSON
}

# Filter for query templates
input QueryTemplatesFilter {
  search: String
  isActive: Boolean
  createdBy: String
  createdAfter: DateTime
  createdBefore: DateTime
  templateType: String
  tags: [String!]
  tagMatchMode: TagMatchMode
  applicableToTable: String
  includeUniversal: Boolean
  usageCountMin: Int
  complexityMin: Int
  complexityMax: Int
}

enum TagMatchMode {
  ANY
  ALL
}

# Connection types for query templates
type QueryTemplatesConnection implements Connection {
  templates: [QueryTemplate!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Operation result types for query templates
type CreateQueryTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
}

type UpdateQueryTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
}

type UpdateTemplateQueryPayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
  previousQuery: String
}

type DeleteQueryTemplatePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}

type ExecuteQueryTemplatePayload {
  success: Boolean!
  data: JSON
  execution: QueryTemplateExecution
  errors: [Error!]!
}

type TemplateExecutionResult {
  success: Boolean!
  data: JSON
  errors: [TemplateExecutionError!]
  metadata: TemplateExecutionMetadata!
}

type TemplateExecutionError {
  message: String!
  locations: [GraphQLLocation!]
  path: [String!]
  code: String
}

type GraphQLLocation {
  line: Int!
  column: Int!
}

type TemplateExecutionMetadata {
  templateId: ID!
  templateName: String!
  complexityScore: Int!
  estimatedTokens: Int
  version: String!
  executionTime: Int!
}

# Import/Export Types
type ExportTemplatePayload implements OperationResult {
  success: Boolean!
  exportData: String
  filename: String
  errors: [Error!]!
}

type ImportTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
  warnings: [String!]
}
