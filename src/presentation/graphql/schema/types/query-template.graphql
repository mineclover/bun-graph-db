# Query Template domain types

type QueryTemplate implements Node {
  id: ID!
  identifier: String!
  name: String!
  description: String
  query: String!
  queryName: [String!]!
  operationType: OperationType!
  variables: JSON
  inputSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  complexityScore: Int!
  usageCount: Int!
  lastUsedAt: DateTime
  avgExecutionTimeMs: Int!
  version: String!
  isActive: Boolean!
  tags: [String!]!
  createdBy: String
  createdAt: DateTime!
  updatedAt: DateTime!

  # Computed validation fields
  isValid: Boolean!
  validationErrors: [String!]!
}

enum OperationType {
  QUERY
  MUTATION
  SUBSCRIPTION
}

type QueryTemplateExecution {
  id: ID!
  templateId: ID!
  executedAt: DateTime!
  duration: Float!
  resultCount: Int!
  success: Boolean!
  errorMessage: String
}

# Input types for query template operations
input CreateQueryTemplateInput {
  identifier: String!
  name: String!
  description: String
  query: String!
  queryName: String
  variables: JSON
  inputSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  complexityScore: Int
  version: String
  tags: [String!]
  createdBy: String
}

input UpdateQueryTemplateInput {
  name: String
  description: String
  query: String
  queryName: String
  variables: JSON
  inputSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  complexityScore: Int
  version: String
  tags: [String!]
}

input ExecuteQueryTemplateInput {
  templateId: ID
  templateIdentifier: String
  variables: JSON
}

# Filter for query templates
input QueryTemplatesFilter {
  search: String
  isActive: Boolean
  createdBy: String
  createdAfter: DateTime
  createdBefore: DateTime
  templateType: String
  tags: [String!]
  tagMatchMode: TagMatchMode
  systemQueries: [String!]
  systemQueryMatchMode: TagMatchMode
  applicableToTable: String
  includeUniversal: Boolean
  usageCountMin: Int
  complexityMin: Int
  complexityMax: Int
}

enum TagMatchMode {
  ANY
  ALL
}

# Connection types for query templates
type QueryTemplatesConnection implements Connection {
  templates: [QueryTemplate!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

# Operation result types for query templates
type CreateQueryTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
}

type UpdateQueryTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
}

type UpdateTemplateQueryPayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
  previousQuery: String
}

type DeleteQueryTemplatePayload implements OperationResult {
  success: Boolean!
  errors: [Error!]!
}

type ExecuteQueryTemplatePayload {
  success: Boolean!
  data: JSON
  execution: QueryTemplateExecution
  errors: [Error!]!
}

type TemplateExecutionResult {
  success: Boolean!
  data: JSON
  errors: [TemplateExecutionError!]
  executionTime: Int!
  metadata: TemplateExecutionMetadata!
}

type TemplateExecutionError {
  message: String!
  locations: [GraphQLLocation!]
  path: [String!]
  code: String
}

type GraphQLLocation {
  line: Int!
  column: Int!
}

type TemplateExecutionMetadata {
  templateId: ID!
  templateName: String!
  complexityScore: Int!
  estimatedTokens: Int
  version: String!
  executionTime: Int!
}

# Import/Export Types
type ExportTemplatePayload implements OperationResult {
  success: Boolean!
  exportData: String
  filename: String
  errors: [Error!]!
}

type ExportTemplatesPayload implements OperationResult {
  success: Boolean!
  exportedTemplates: [ExportedTemplateInfo!]!
  totalCount: Int!
  outputDirectory: String
  errors: [Error!]!
}

type ExportedTemplateInfo {
  templateId: ID!
  templateIdentifier: String!
  templateName: String!
  filename: String!
  exportSuccess: Boolean!
  exportError: String
}

type ImportTemplatePayload implements OperationResult {
  success: Boolean!
  template: QueryTemplate
  errors: [Error!]!
  warnings: [String!]
}

# Table dependency specific types
input FindTemplatesByTableInput {
  tableName: String!
  includeUniversal: Boolean = true
}

type TableDependencyTemplateResult {
  tableName: String!
  templates: [QueryTemplate!]!
  totalCount: Int!
}

# MCP InputSchema Validation Types
type SchemaValidationError {
  "JSON path to the error location (e.g., $.properties.status)"
  path: String!
  "Human-readable error message"
  message: String!
  "Actual value that caused the error"
  value: JSON
  "Expected value or type"
  expected: String
}

type SchemaValidationResult {
  "Whether the schema is valid for MCP"
  valid: Boolean!
  "List of validation errors (blocking issues)"
  errors: [SchemaValidationError!]!
  "List of validation warnings (recommendations)"
  warnings: [SchemaValidationError!]!
  "Human-readable formatted result"
  formattedResult: String!
}

input ValidateInputSchemaInput {
  "JSON Schema to validate for MCP compatibility"
  schema: JSON!
}

type ValidateInputSchemaPayload implements OperationResult {
  success: Boolean!
  validation: SchemaValidationResult!
  errors: [Error!]!
}

# Runtime Data Validation Types (validates actual data against JSON Schema)
type DataValidationError {
  "Standardized error code for programmatic handling (e.g., CONSTRAINT_MIN_LENGTH, TYPE_STRING_EXPECTED)"
  code: String!
  "JSON path to the error location (e.g., $.status)"
  path: String!
  "Human-readable error message"
  message: String!
  "Actual value that caused the error"
  value: JSON
  "Expected value or type"
  expected: String
  "Constraint that was violated (legacy, use code instead)"
  constraint: String
}

type DataValidationResult {
  "Whether the data is valid according to the schema"
  valid: Boolean!
  "List of validation errors"
  errors: [DataValidationError!]!
  "Coerced data (with type conversions applied)"
  coercedData: JSON
  "Human-readable formatted result"
  formattedResult: String!
}

input ValidateDataInput {
  "Data to validate"
  data: JSON!
  "JSON Schema to validate against"
  schema: JSON!
}

type ValidateDataPayload implements OperationResult {
  success: Boolean!
  validation: DataValidationResult!
  errors: [Error!]!
}
