# Root GraphQL Schema - Main entry point

# Common scalars
scalar DateTime
scalar JSON

# Health status type is defined in schemas/common.graphql

# Root types - Query, Mutation, Subscription will be extended by domain schemas
type Query {
  # Health check endpoint - defined in system-queries.graphql
  _schema: String # Required placeholder for empty root type
}

type Mutation {
  # Extended by domain schemas
  _schema: String # Required placeholder for empty root type
}

type Subscription {
  # Real-time updates will be added by domain schemas
  _schema: String # Required placeholder for empty root type
}

# Common error type
type Error {
  message: String!
  code: String!
  field: String
}
