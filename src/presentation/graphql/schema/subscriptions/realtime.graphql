# Real-time Subscription extensions

extend type Subscription {
  # Table subscriptions
  tableCreated: Table!
  tableUpdated: Table!
  tableDeleted: TableDeletedEvent!

  # Node subscriptions
  nodeCreated(tableId: ID): TableNode!
  nodeUpdated(tableId: ID): TableNode!
  nodeDeleted(tableId: ID): NodeDeletedEvent!

  # Relation subscriptions
  relationCreated(tableId: ID): NodeRelation!
  relationDeleted(tableId: ID): NodeRelation!

  # Template execution subscriptions
  executeTemplateStream(
    templateIdentifier: String!
    variables: JSON
    trackUsage: Boolean = true
  ): TemplateExecutionStream!

  # System subscriptions
  systemHealthChanged: SystemHealth!
  performanceAlert: PerformanceMetrics!
}

# Event types for subscriptions
type TableDeletedEvent {
  id: ID!
  identifier: String!
  deletedAt: DateTime!
}

type NodeDeletedEvent {
  id: ID!
  tableId: ID!
  content: String!
  deletedAt: DateTime!
}

# Template execution stream types
type TemplateExecutionStream {
  status: ExecutionStatus!
  data: JSON
  progress: Float
  metadata: TemplateExecutionMetadata!
  timestamp: DateTime!
  error: String
}

enum ExecutionStatus {
  STARTING
  IN_PROGRESS
  COMPLETED
  ERROR
}

# TemplateExecutionMetadata is defined in query-template.graphql
