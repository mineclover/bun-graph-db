# Common scalars and types
scalar DateTime

# Error handling
type Error {
  message: String!
  code: String!
  field: String
}

# Base types from SQLite schema
type Query {
  # Placeholder - will be extended by other schema files
  _empty: String
}

type Mutation {
  # Placeholder to extend in other schemas
  _empty: String
}

type Subscription {
  # Real-time updates defined in subscriptions/realtime.graphql
  _placeholder: String
}

# Common health types are now defined in system-queries.graphql

# Event types for subscriptions
type TableDeletedEvent {
  id: ID!
  identifier: String!
  deletedAt: DateTime!
}

type NodeDeletedEvent {
  id: ID!
  tableId: ID!
  content: String!
  deletedAt: DateTime!
}
