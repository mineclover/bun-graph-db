# Relation Mutation extensions

extend type Mutation {
  # Relation Type management
  createRelationType(
    input: CreateRelationTypeInput!
  ): CreateRelationTypePayload!
  
  # Node Relation management
  createRelation(
    input: CreateRelationInput!
  ): CreateRelationPayload!
  
  deleteRelation(
    id: ID!
  ): DeleteRelationPayload!
}