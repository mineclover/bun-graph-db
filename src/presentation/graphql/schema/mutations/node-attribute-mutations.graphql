# Node Attribute Mutation extensions

extend type Mutation {
  # Node Attribute management
  # Note: setNodeAttribute is already defined in node-mutations.graphql

  # Additional node attribute operations for comprehensive coverage
  updateNodeAttributeValue(nodeId: ID!, attributeId: ID!, value: String!): SetNodeAttributePayload!

  removeNodeAttribute(nodeId: ID!, attributeId: ID!): SetNodeAttributePayload!

  # Bulk operations for better SQL coverage
  bulkSetNodeAttributes(nodeId: ID!, attributes: [NodeAttributeInput!]!): SetNodeAttributePayload!
}
