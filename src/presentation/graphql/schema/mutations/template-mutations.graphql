# Query Template Mutation extensions

extend type Mutation {
  # Template management
  createTemplate(input: CreateQueryTemplateInput!): CreateQueryTemplatePayload!

  updateTemplate(id: ID!, input: UpdateQueryTemplateInput!): UpdateQueryTemplatePayload!

  deleteTemplate(id: ID!): DeleteQueryTemplatePayload!

  # Template state management
  activateTemplate(id: ID!): QueryTemplate

  deactivateTemplate(id: ID!): QueryTemplate

  # Template execution
  executeTemplate(input: ExecuteQueryTemplateInput!): ExecuteQueryTemplatePayload!

  # Template execution with GraphQL
  executeTemplateWithGraphQL(
    templateIdentifier: String!
    variables: JSON
    trackUsage: Boolean
  ): TemplateExecutionResult!

  # Template query update (specific mutation for updating query text)
  updateTemplateQuery(
    templateId: ID
    templateIdentifier: String
    newQuery: String!
    updateVariables: JSON
  ): UpdateTemplateQueryPayload!

  # Template import/export
  exportTemplate(templateId: ID, templateIdentifier: String, includeStatistics: Boolean): ExportTemplatePayload!

  # Batch export templates with filters
  exportTemplates(
    filter: QueryTemplatesFilter
    includeStatistics: Boolean
    outputDirectory: String
  ): ExportTemplatesPayload!

  importTemplate(
    jsonData: String!
    overwriteExisting: Boolean
    generateNewIdentifier: Boolean
    newIdentifierPrefix: String
  ): ImportTemplatePayload!
}
