extend type Query {
  # Essential system queries only
  healthCheck: HealthStatus!
  systemStatus: SystemStatusResult!
}

# Removed detailed system stats types - keeping only essential ones

# Basic health status for simple health checks
type HealthStatus {
  status: String!
  timestamp: DateTime!
  database: Boolean!
  version: String!
  memory: MemoryHealthStatus!
}

# Removed duplicate SystemHealthStatus type

type MemoryHealthStatus {
  status: String! # "healthy", "warning", "critical"
  percentage: Float!
  message: String
}

# System initialization status
type SystemStatusResult {
  database: Boolean!
  summary: SystemSummary!
  lastInitialized: String
}
