extend type Query {
  # System monitoring and statistics
  systemStats: SystemStats!
  memoryStats: MemoryStats!
  healthCheck: HealthStatus!
  systemHealthCheck: SystemHealthStatus!

  # System initialization status
  systemStatus: SystemStatusResult!
}

type SystemStats {
  memory: MemoryStats!
  process: ProcessStats!
  database: DatabaseStats!
  timestamp: DateTime!
  uptime: Int!
}

type MemoryStats {
  used: Int!
  free: Int!
  total: Int!
  percentage: Float!
  heap: HeapStats!
}

type HeapStats {
  used: Int!
  total: Int!
  external: Int!
  arrayBuffers: Int!
}

type ProcessStats {
  pid: Int!
  cpu: Float!
  version: String!
  platform: String!
  memoryDetails: ProcessMemoryDetails!
}

type ProcessMemoryDetails {
  rss: Int! # Resident Set Size in MB
  heapUsed: Int! # Used heap memory in MB
  heapTotal: Int! # Total allocated heap in MB
  external: Int! # External C++ objects memory in MB
  arrayBuffers: Int! # ArrayBuffers memory in MB
  heapEfficiency: Int! # Heap efficiency percentage
  memoryPressure: String! # Memory pressure level: low/medium/high
}

type DatabaseStats {
  connectionCount: Int!
  queryCount: Int!
  averageQueryTime: Float!
}

# Basic health status for simple health checks
type HealthStatus {
  status: String!
  timestamp: DateTime!
  database: Boolean!
  version: String!
  memory: MemoryHealthStatus!
}

# Detailed system health status for comprehensive monitoring
type SystemHealthStatus {
  status: String!
  timestamp: DateTime!
  database: Boolean!
  version: String!
  memory: MemoryHealthStatus!
}

type MemoryHealthStatus {
  status: String! # "healthy", "warning", "critical"
  percentage: Float!
  message: String
}

# System initialization status
type SystemStatusResult {
  database: Boolean!
  summary: SystemSummary!
  lastInitialized: String
}
