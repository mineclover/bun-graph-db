# Enhanced Relations Query extensions - Full utilization of relations schema
# This file implements 100% utilization of the relations system including strength, confidence, and external references

extend type Query {
  # Relation Analytics - Previously underutilized relationship analysis
  relationAnalytics(filter: RelationAnalyticsFilter): RelationAnalytics!

  # Graph Traversal - Utilize strength and confidence for pathfinding
  findOptimalPath(input: OptimalPathInput!): OptimalPath!

  # Node Connectivity Analysis - Network analysis using relations
  getNodeConnectivity(
    nodeId: ID!
    maxDepth: Int = 3
    minStrength: Int = 1
    minConfidence: Int = 1
  ): NodeConnectivityResult!

  # Relationship Strength Analysis - Utilize strength field
  analyzeRelationshipStrength(filter: StrengthAnalysisFilter): RelationshipStrengthAnalysis!

  # External Reference Resolution - Utilize external_id fields
  resolveExternalReferences(input: ExternalReferenceInput!): ExternalReferenceResult!

  # Relation Pattern Discovery - Advanced graph analysis
  discoverRelationPatterns(input: PatternDiscoveryInput!): [RelationPattern!]!

  # Confidence-based Filtering - Utilize confidence scores
  getHighConfidenceRelations(
    minConfidence: Int = 3
    relationTypes: [String!]
    tableIds: [ID!]
  ): [HighConfidenceRelation!]!
}

# Relation analytics types
type RelationAnalytics {
  totalRelations: Int!
  internalRelations: Int!
  externalRelations: Int!
  relationTypeDistribution: [RelationTypeStats!]!
  strengthDistribution: StrengthDistribution!
  confidenceDistribution: ConfidenceDistribution!
  tableConnectivity: [TableConnectivity!]!
  networkMetrics: NetworkMetrics!
}

type RelationTypeStats {
  relationType: RelationType!
  count: Int!
  averageStrength: Float!
  averageConfidence: Float!
  externalReferences: Int!
}

type StrengthDistribution {
  invalid: Int! # strength = 0
  autoGenerated: Int! # strength = 1
  uncertain: Int! # strength = 2
  confident: Int! # strength = 3
  veryStrong: Int! # strength = 4
}

type ConfidenceDistribution {
  probablyWrong: Int! # confidence = 0
  autoGenerated: Int! # confidence = 1
  uncertainButValid: Int! # confidence = 2
  confident: Int! # confidence = 3
  verified: Int! # confidence = 4
}

type TableConnectivity {
  table: Table!
  internalConnections: Int!
  externalConnections: Int!
  averageStrength: Float!
  averageConfidence: Float!
  mostCommonRelationType: RelationType
}

type NetworkMetrics {
  density: Float! # Relation density
  clustering: Float! # Clustering coefficient
  averagePathLength: Float!
  mostConnectedNodes: [NodeConnectivitySummary!]!
  isolatedNodes: Int!
}

# Optimal path finding
type OptimalPath {
  path: [PathNode!]!
  totalDistance: Float!
  averageStrength: Float!
  averageConfidence: Float!
  pathQuality: PathQuality!
  alternativePaths: [AlternativePath!]!
}

type PathNode {
  node: TableNode!
  relation: NodeRelation
  distanceFromSource: Int!
  strengthToNext: Int
  confidenceToNext: Int
}

type AlternativePath {
  path: [PathNode!]!
  totalDistance: Float!
  pathQuality: PathQuality!
  qualityDifference: Float!
}

# Node connectivity analysis
type NodeConnectivityResult {
  centralNode: TableNode!
  connectedNodes: [EnhancedConnectedNode!]!
  relationshipSummary: RelationshipSummary!
  networkPosition: NetworkPosition!
  influenceScore: Float!
}

type EnhancedConnectedNode {
  node: TableNode!
  relation: NodeRelation!
  distance: Int!
  strength: Int!
  confidence: Int!
  relationPath: [NodeRelation!]!
}

type RelationshipSummary {
  totalConnections: Int!
  outgoingRelations: Int!
  incomingRelations: Int!
  bidirectionalRelations: Int!
  averageStrength: Float!
  averageConfidence: Float!
  relationTypeBreakdown: [RelationTypeCount!]!
}

type NetworkPosition {
  centrality: Float!
  betweenness: Float!
  clustering: Float!
  isHub: Boolean!
  isBridge: Boolean!
}

# Relationship strength analysis
type RelationshipStrengthAnalysis {
  overallStats: StrengthStats!
  strengthByType: [StrengthByType!]!
  strengthEvolution: [StrengthEvolution!]!
  weakRelations: [WeakRelation!]!
  strongRelations: [StrongRelation!]!
}

type StrengthStats {
  averageStrength: Float!
  strengthVariance: Float!
  distributionSkew: Float!
  reliabilityScore: Float!
}

type StrengthByType {
  relationType: RelationType!
  averageStrength: Float!
  strengthRange: IntRange!
  reliability: Float!
}

type StrengthEvolution {
  timeWindow: String!
  averageStrength: Float!
  trend: Trend!
}

# External reference types
type ExternalReferenceResult {
  resolvedReferences: [ResolvedReference!]!
  unresolvedReferences: [UnresolvedReference!]!
  resolutionStats: ResolutionStats!
}

type ResolvedReference {
  relation: NodeRelation!
  externalId: String!
  resolvedData: JSON
  confidence: Float!
  metadata: JSON
}

type UnresolvedReference {
  relation: NodeRelation!
  externalId: String!
  reason: String!
  suggestions: [String!]!
}

type ResolutionStats {
  totalReferences: Int!
  resolved: Int!
  unresolved: Int!
  resolutionRate: Float!
  averageResolutionTime: Float!
}

# Pattern discovery types
type RelationPattern {
  patternId: String!
  description: String!
  occurrences: Int!
  confidence: Float!
  nodes: [TableNode!]!
  relations: [NodeRelation!]!
  strength: Float!
  significance: Float!
}

# High confidence relations
type HighConfidenceRelation {
  relation: NodeRelation!
  confidenceScore: Int!
  strengthScore: Int!
  qualityMetrics: RelationQualityMetrics!
  validationStatus: ValidationStatus!
}

type RelationQualityMetrics {
  consistency: Float!
  reliability: Float!
  accuracy: Float!
  completeness: Float!
}

# Input types
input RelationAnalyticsFilter {
  tableIds: [ID!]
  relationTypes: [String!]
  strengthRange: IntRangeInput
  confidenceRange: IntRangeInput
  includeExternal: Boolean = true
  timeRange: TimeRangeInput
}

input OptimalPathInput {
  sourceNodeId: ID!
  targetNodeId: ID!
  algorithm: PathAlgorithm = WEIGHTED_SHORTEST
  weightingStrategy: WeightingStrategy = STRENGTH_CONFIDENCE
  maxDepth: Int = 10
  avoidNodes: [ID!]
  preferredRelationTypes: [String!]
}

input StrengthAnalysisFilter {
  tableIds: [ID!]
  relationTypes: [String!]
  minOccurrences: Int = 5
  timeWindow: TimeWindow
}

input ExternalReferenceInput {
  repositories: [String!]
  referencePatterns: [String!]
  resolutionDepth: Int = 1
  includeMetadata: Boolean = true
}

input PatternDiscoveryInput {
  tableIds: [ID!]
  patternTypes: [PatternType!]
  minOccurrences: Int = 3
  maxDepth: Int = 5
  confidenceThreshold: Float = 0.7
}

# Supporting types
type NodeConnectivitySummary {
  node: TableNode!
  connectionCount: Int!
  averageStrength: Float!
}

type RelationTypeCount {
  relationType: RelationType!
  count: Int!
}

type WeakRelation {
  relation: NodeRelation!
  strengthScore: Int!
  reason: String!
  improvementSuggestions: [String!]!
}

type StrongRelation {
  relation: NodeRelation!
  strengthScore: Int!
  qualityIndicators: [String!]!
  utilizationPotential: Float!
}

type IntRange {
  min: Int!
  max: Int!
}

# Enums
enum PathAlgorithm {
  SHORTEST
  WEIGHTED_SHORTEST
  HIGHEST_CONFIDENCE
  HIGHEST_STRENGTH
  BALANCED_QUALITY
}

enum WeightingStrategy {
  STRENGTH_ONLY
  CONFIDENCE_ONLY
  STRENGTH_CONFIDENCE
  INVERSE_STRENGTH
  CUSTOM
}

enum PathQuality {
  EXCELLENT
  GOOD
  AVERAGE
  POOR
  UNRELIABLE
}

enum Trend {
  INCREASING
  STABLE
  DECREASING
  VOLATILE
}

enum TimeWindow {
  LAST_HOUR
  LAST_DAY
  LAST_WEEK
  LAST_MONTH
  ALL_TIME
}

enum PatternType {
  CLUSTER
  CHAIN
  STAR
  TREE
  CYCLE
  CLIQUE
}

enum ValidationStatus {
  VERIFIED
  CONFIDENT
  UNCERTAIN
  QUESTIONABLE
  INVALID
}
