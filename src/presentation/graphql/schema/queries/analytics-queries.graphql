# Analytics Query extensions

extend type Query {
  # Node analytics
  analyzeNodes(
    input: AnalyzeNodesInput!
  ): AnalyzeNodesPayload!
  
  # Performance metrics
  getPerformanceMetrics(
    timeRange: String = "1h"
    granularity: String = "5m"
  ): [PerformanceMetrics!]!
  
  # Test suite status
  getTestSuiteStatus: TestSuiteStatus!
  
  # Data aggregation
  aggregateData(
    input: AggregateDataInput!
  ): [AggregationResult!]!
  
  # System health
  getSystemHealth: SystemHealth!
}