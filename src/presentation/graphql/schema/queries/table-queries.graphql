# Table Query extensions

extend type Query {
  # Get single table
  table(id: ID!): Table
  tableByIdentifier(identifier: String!): Table

  # Get multiple tables with filtering and pagination
  tables(filter: TablesFilter, pagination: TablesPagination, sort: [SortInput!]): TablesConnection!
  getTables(input: PaginationInput): TablesConnection!

  # Search tables with simplified interface (for MCP compatibility)
  searchTables(filter: TablesFilter): TablesConnection!

  # Get comprehensive table documentation
  tableDocumentation(
    tableId: ID
    identifier: String
    includeDocs: Boolean = true
    includeRelationships: Boolean = true
    includeRelatedTemplates: Boolean = false
    includeUsageStats: Boolean = false
    includeAiMetadata: Boolean = false
  ): TableDocumentation

  # Export a table schema as an OpenAPI 3.2 projection envelope.
  # profile supports "component-bundle" and "operation-contract".
  tableOpenApiProjection(tableId: ID, identifier: String, profile: String = "component-bundle"): JSON
}
