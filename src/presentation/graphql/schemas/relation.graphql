# Graph Query Types (extending existing node relations)

enum RelationDirection {
  OUTGOING
  INCOMING
  BOTH
}

enum RelationDepth {
  DIRECT
  TWO_HOPS
  THREE_HOPS
  UNLIMITED
}

type RelatedNodeResult {
  node: Node!
  attributes: JSON!
  sourceNodeId: ID
  targetNodeId: ID
  relationTypeId: ID
  properties: JSON
  strength: Int
}

type PathResult {
  startNodeId: ID!
  endNodeId: ID!
  path: [ID!]!
  length: Int!
}

type DependencyResult {
  nodeId: ID!
  level: Int!
  relationPath: [String!]!
}

type SearchRelatedNodesResult {
  nodes: [RelatedNodeResult!]!
  relations: [NodeRelation!]!
  paths: [PathResult!]!
  total: Int!
  hasMore: Boolean!
}

input RelationFilterInput {
  relationTypes: [String!]
  properties: JSON
  direction: RelationDirection!
  depth: RelationDepth!
}

input PathQueryInput {
  startNodeIds: [ID!]
  endNodeIds: [ID!]
  relationTypes: [String!]
  maxDepth: Int
  shortestPath: Boolean
}

input GraphQueryInput {
  nodeFilters: JSON
  relationFilters: [RelationFilterInput!]
  pathQueries: [PathQueryInput!]
  limit: Int
  offset: Int
}

input RelationFilterInput {
  relationTypes: [String!]
  properties: JSON
  direction: RelationDirection!
  depth: RelationDepth!
}

input PathQueryInput {
  startNodeIds: [ID!]
  endNodeIds: [ID!]
  relationTypes: [String!]
  maxDepth: Int
  shortestPath: Boolean
}

input SearchRelatedNodesInput {
  tableId: ID!
  sourceNodeIds: [ID!]
  relationFilters: [RelationFilterInput!]
  pathQueries: [PathQueryInput!]
  nodeFilters: JSON
  limit: Int
  offset: Int
}

extend type Query {
  # Search related nodes with advanced graph queries
  searchRelatedNodesAdvanced(input: SearchRelatedNodesInput!): SearchRelatedNodesResult!

  # Get dependency chain (legacy schema)
  getDependencyChainLegacy(
    tableId: ID!
    nodeId: ID!
    direction: RelationDirection
    relationTypes: [String!]
  ): [DependencyResult!]!
}
