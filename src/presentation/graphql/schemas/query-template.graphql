# Query Template GraphQL Schema

type Query {
  # 템플릿 검색
  searchTemplates(input: SearchTemplatesInput!): [QueryTemplate!]!

  # 단일 템플릿 조회
  getTemplate(id: ID!): QueryTemplate
  getTemplateByIdentifier(identifier: String!): QueryTemplate

  # 인기 템플릿 조회
  getPopularTemplates(limit: Int = 10): [QueryTemplate!]!

  # 템플릿 기반 쿼리 실행
  executeTemplate(input: ExecuteTemplateInput!): JSON!
}

type Mutation {
  # 템플릿 관리
  createTemplate(input: CreateTemplateInput!): QueryTemplate!
  updateTemplate(id: ID!, input: UpdateTemplateInput!): QueryTemplate!
  deleteTemplate(id: ID!): Boolean!

  # 템플릿 상태 관리
  activateTemplate(id: ID!): QueryTemplate!
  deactivateTemplate(id: ID!): QueryTemplate!

  # 템플릿 기반 쿼리 실행
  executeTemplate(input: ExecuteTemplateInput!): JSON!
}

type QueryTemplate {
  id: ID!
  identifier: String!
  name: String!
  description: String
  queryText: String!
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  templateType: TemplateType!
  complexityScore: Int!
  usageCount: Int!
  version: String!
  isActive: Boolean!
  tags: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum TemplateType {
  QUERY
  MUTATION
  SUBSCRIPTION
}

input SearchTemplatesInput {
  # 태그 기반 검색
  tags: [String!]
  tagMatchMode: TagMatchMode

  # 테이블 필터링
  applicableToTable: String
  includeUniversal: Boolean = true

  # 타입 필터링
  templateType: TemplateType

  # 상태 필터링
  isActive: Boolean

  # 정렬
  orderBy: TemplateOrderBy
  orderDirection: OrderDirection

  # 페이징
  limit: Int = 20
  offset: Int = 0
}

enum TagMatchMode {
  ANY # OR 조건
  ALL # AND 조건
}

enum TemplateOrderBy {
  USAGE_COUNT
  CREATED_AT
  UPDATED_AT
  NAME
}

enum OrderDirection {
  ASC
  DESC
}

input CreateTemplateInput {
  identifier: String!
  name: String!
  description: String
  queryText: String!
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  templateType: TemplateType = QUERY
  complexityScore: Int = 1
  tags: [String!]!
}

input UpdateTemplateInput {
  name: String
  description: String
  queryText: String
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  templateType: TemplateType
  complexityScore: Int
  tags: [String!]
  version: String
  isActive: Boolean
}

# 템플릿 실행 관련
input ExecuteTemplateInput {
  # 템플릿 식별 (둘 중 하나 필수)
  templateId: ID
  templateIdentifier: String

  # 변수
  variables: JSON

  # 실행 옵션
  trackUsage: Boolean = true
  validateVariables: Boolean = true
}
