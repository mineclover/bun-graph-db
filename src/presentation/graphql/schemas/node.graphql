# Node type definitions based on SQLite schema  
type Node {
  id: ID!
  table: Table!
  content: String!
  title: String
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!
  
  # Attribute values
  attributes: [NodeAttribute!]!
  
  # Relations
  outgoingRelations: [NodeRelation!]!
  incomingRelations: [NodeRelation!]!
  
  # Computed fields
  attributeCount: Int!
  relationCount: Int!
}

type NodeAttribute {
  id: ID!
  node: Node!
  attribute: Attribute!
  value: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NodeRelation {
  id: ID!
  table: Table!
  sourceNode: Node
  sourceExternalId: String!
  targetNode: Node  
  targetExternalId: String!
  relationType: RelationType!
  properties: JSON
  strength: Int!
  confidence: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type RelationType {
  id: ID!
  identifier: String!
  description: String
  category: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Input types
input CreateNodeInput {
  tableId: ID!
  content: String!
  title: String
  description: String
  attributes: [NodeAttributeInput!]
}

input UpdateNodeInput {
  content: String
  title: String
  description: String
}

input NodeAttributeInput {
  attributeId: ID!
  value: JSON!
}

input CreateRelationInput {
  tableId: ID!
  sourceNodeId: ID
  sourceExternalId: String
  targetNodeId: ID
  targetExternalId: String
  relationTypeId: ID!
  properties: JSON
  strength: Int = 1
  confidence: Int = 1
}

input CreateRelationTypeInput {
  identifier: String!
  description: String
  category: String
}

input SearchNodesInput {
  tableId: ID!
  query: String
  limit: Int
  offset: Int
  sortBy: [SortInput!]
}

input SortInput {
  field: String!
  direction: SortDirection!
}

enum SortDirection {
  ASC
  DESC
}

# Legacy search filter (keeping for backward compatibility)
input NodeSearchFilter {
  tableId: ID
  content: String
  title: String
  hasAttributes: [ID!]
  attributeValues: [AttributeValueFilter!]
  createdAfter: DateTime
  createdBefore: DateTime
}

input AttributeValueFilter {
  attributeId: ID!
  operator: ComparisonOperator!
  value: JSON!
}

enum ComparisonOperator {
  EQUALS
  NOT_EQUALS
  CONTAINS
  STARTS_WITH
  ENDS_WITH
  GREATER_THAN
  LESS_THAN
  IN
  NOT_IN
}

# Payload types
type CreateNodePayload {
  node: Node
  errors: [Error!]!
}

type UpdateNodePayload {
  node: Node
  errors: [Error!]!
}

type DeleteNodePayload {
  success: Boolean!
  errors: [Error!]!
}

type CreateRelationPayload {
  relation: NodeRelation
  errors: [Error!]!
}

type CreateRelationTypePayload {
  relationType: RelationType
  errors: [Error!]!
}

# Connection types
type NodesConnection {
  nodes: [Node!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type SearchNodesResult {
  nodes: [Node!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  query: SearchQueryInfo!
}

type SearchQueryInfo {
  originalQuery: String!
  parsedConditions: JSON!
}

# Node creation preview types
input PreviewNodeInput {
  tableId: ID!
  content: String!
  domain: String
  title: String
  description: String
  hints: [String!]
  context: JSON
}

type NodeCreationPreview {
  # Suggested node structure
  suggestedNode: SuggestedNodeStructure!
  
  # Similar existing nodes
  similarNodes: [Node!]!
  
  # Potential conflicts
  conflicts: [NodeConflict!]!
  
  # Domain-based suggestions
  domainSuggestions: DomainNodeSuggestions!
  
  # Validation results
  validation: NodeValidationResult!
}

type SuggestedNodeStructure {
  content: String!
  title: String
  description: String
  confidence: Float!
  
  # Suggested attributes based on domain patterns
  suggestedAttributes: [SuggestedAttribute!]!
  
  # Potential relations
  potentialRelations: [SuggestedRelation!]!
  
  # Applied patterns
  appliedPatterns: [String!]!
  reasoning: String!
}

type SuggestedAttribute {
  attributeId: ID!
  attributeName: String!
  attributeType: String!
  suggestedValue: JSON
  confidence: Float!
  reasoning: String!
  isRequired: Boolean!
}

type SuggestedRelation {
  targetNodeId: ID!
  targetNodeContent: String!
  relationTypeId: ID!
  relationTypeName: String!
  direction: String! # OUTGOING, INCOMING, BIDIRECTIONAL
  strength: Int!
  confidence: Int!
  reasoning: String!
}

type NodeConflict {
  type: ConflictType!
  severity: ConflictSeverity!
  message: String!
  existingNodeId: ID
  suggestedAction: String!
}

enum ConflictType {
  DUPLICATE_CONTENT
  SIMILAR_CONTENT
  CONSTRAINT_VIOLATION
  DOMAIN_MISMATCH
}

enum ConflictSeverity {
  ERROR
  WARNING
  INFO
}

type DomainNodeSuggestions {
  domain: String!
  
  # Common node patterns for this domain
  commonPatterns: [DomainPattern!]!
  
  # Recommended node structure
  recommendedStructure: JSON!
  
  # Domain-specific validation rules
  validationRules: [String!]!
  
  # Related nodes in same domain
  domainNodes: [Node!]!
}

type DomainPattern {
  patternName: String!
  description: String!
  confidence: Float!
  examples: [String!]!
  attributes: [String!]!
  relations: [String!]!
}

type NodeValidationResult {
  isValid: Boolean!
  errors: [ValidationError!]!
  warnings: [ValidationWarning!]!
  recommendations: [String!]!
}

type ValidationError {
  field: String!
  message: String!
  code: String!
}

type ValidationWarning {
  field: String!
  message: String!
  suggestion: String!
}

extend type Query {
  # Single node queries
  node(id: ID!): Node
  nodeByContent(tableId: ID!, content: String!): Node
  
  # Multiple node queries
  nodes(tableId: ID!, pagination: TablesPagination): NodesConnection!
  
  # Advanced search with query parsing
  searchNodes(input: SearchNodesInput!): SearchNodesResult!
  
  
  # Pre-creation node information and suggestions
  previewNodeCreation(input: PreviewNodeInput!): NodeCreationPreview!
  
  # Relations
  nodeRelation(id: ID!): NodeRelation
  nodeRelations(tableId: ID!): [NodeRelation!]!
  relationTypes: [RelationType!]!
  relationType(id: ID!): RelationType
}

extend type Mutation {
  # Node management
  createNode(input: CreateNodeInput!): CreateNodePayload!
  updateNode(id: ID!, input: UpdateNodeInput!): UpdateNodePayload!
  deleteNode(id: ID!): DeleteNodePayload!
  
  # Node attribute management
  setNodeAttribute(nodeId: ID!, attributeId: ID!, value: JSON!): UpdateNodePayload!
  removeNodeAttribute(nodeId: ID!, attributeId: ID!): UpdateNodePayload!
  
  # Relation management
  createRelation(input: CreateRelationInput!): CreateRelationPayload!
  deleteRelation(id: ID!): DeleteNodePayload!
  
  # Relation type management
  createRelationType(input: CreateRelationTypeInput!): CreateRelationTypePayload!
}