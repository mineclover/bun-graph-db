# Table Package Export/Import System
# Selective table export/import with dependency resolution and auto-generated templates

# Core table package format
type TablePackage {
  version: String!
  exportedAt: DateTime!
  sourceTable: TablePackageSource!
  dependencies: [String!]!
  package: TablePackageContent!
}

type TablePackageSource {
  identifier: String!
  description: String
}

type TablePackageContent {
  schema: TableSchemaExport!
  dataset: TableDataExport!
  relations: TableRelationsExport!
  templates: TableTemplatesExport!
}

# Schema export structure
type TableSchemaExport {
  table: TableInfo!
  attributes: [AttributeInfo!]!
  attributeTypes: [AttributeTypeInfo!]!
}

type TableInfo {
  identifier: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AttributeInfo {
  identifier: String!
  attributeTypeId: String!
  description: String
  isRequired: Boolean!
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AttributeTypeInfo {
  id: String!
  identifier: String!
  description: String
  dataType: String!
  validation: JSON
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Data export structure
type TableDataExport {
  nodes: [NodeExport!]!
  nodeAttributes: [NodeAttributeExport!]!
}

type NodeExport {
  externalId: String!
  nodeType: String!
  content: JSON
  metadata: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NodeAttributeExport {
  nodeExternalId: String!
  attributeIdentifier: String!
  value: JSON!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Relations export structure
type TableRelationsExport {
  relationTypes: [RelationTypeExport!]!
  nodeRelations: [NodeRelationExport!]!
}

type RelationTypeExport {
  id: String!
  identifier: String!
  description: String
  properties: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NodeRelationExport {
  sourceExternalId: String!
  targetExternalId: String!
  relationTypeId: String!
  properties: JSON
  strength: Float!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Templates export structure
type TableTemplatesExport {
  templates: [QueryTemplateExport!]!
}

type QueryTemplateExport {
  identifier: String!
  name: String!
  description: String
  query: String!
  queryName: [String!]!
  operationType: OperationType!
  variables: JSON
  variablesSchema: JSON
  defaultVariables: JSON
  applicableTables: [String!]
  complexityScore: Int!
  version: String!
  tags: [String!]!
  isActive: Boolean!
  statistics: QueryTemplateStatistics
}

type QueryTemplateStatistics {
  usageCount: Int!
  avgExecutionTimeMs: Float!
  lastUsedAt: DateTime
}

# Input types for export operations
input TablePackageExportOptions {
  includeData: Boolean = true
  includeRelations: Boolean = true
  includeTemplates: Boolean = true
  includeStatistics: Boolean = false
  resolveDependencies: Boolean = true
  prettyPrint: Boolean = true
}

input TablePackageImportOptions {
  conflictResolution: ConflictResolution! = SKIP
  importData: Boolean = true
  importRelations: Boolean = true
  importTemplates: Boolean = true
  preserveStatistics: Boolean = true
  validateIntegrity: Boolean = true
  generateTemplates: Boolean = true
  newTablePrefix: String
}

enum ConflictResolution {
  OVERWRITE
  MERGE
  RENAME
  SKIP
}

# Export result types
type TablePackageExportResult {
  success: Boolean!
  tablePackage: TablePackage
  dependencyOrder: [String!]
  packagePath: String
  errors: [String!]!
  warnings: [String!]!
}

type TablePackageImportResult {
  success: Boolean!
  importedTable: ImportedTableInfo
  generatedTemplates: [GeneratedTemplateInfo!]!
  resolvedConflicts: [ResolvedConflict!]!
  errors: [String!]!
  warnings: [String!]!
}

type ImportedTableInfo {
  id: ID!
  identifier: String!
  originalIdentifier: String!
}

type GeneratedTemplateInfo {
  id: ID!
  identifier: String!
  name: String!
  operationType: String!
}

type ResolvedConflict {
  type: ConflictType!
  originalName: String!
  resolvedName: String!
  action: ConflictAction!
}

enum ConflictType {
  TABLE
  TEMPLATE
  ATTRIBUTE
}

enum ConflictAction {
  RENAMED
  MERGED
  OVERWRITTEN
  SKIPPED
}

# Dependency analysis types
type TableDependencyInfo {
  tableIdentifier: String!
  dependencies: [String!]!
  dependents: [String!]!
  depth: Int!
  circularReferences: [String!]!
}

# Import session tracking
type ImportSession {
  sessionId: ID!
  status: ImportSessionStatus!
  startedAt: DateTime!
  completedAt: DateTime
  packagesImported: [String!]!
  packagesRemaining: [String!]!
  rollbackInfo: ImportSessionRollback!
  errors: [String!]!
}

type ImportSessionRollback {
  tablesCreated: [String!]!
  templatesCreated: [String!]!
  nodesCreated: [String!]!
}

enum ImportSessionStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
  FAILED
  ROLLED_BACK
}

# Package validation
type TablePackageConflict {
  type: ConflictType!
  severity: ConflictSeverity!
  message: String!
  context: ConflictContext!
  suggestedResolution: String
}

type ConflictContext {
  tableName: String
  templateName: String
  attributeName: String
  dependency: String
}

enum ConflictSeverity {
  ERROR
  WARNING
}

# Template generation options
input TemplateGenerationOptions {
  includeCreate: Boolean = true
  includeRead: Boolean = true
  includeUpdate: Boolean = true
  includeDelete: Boolean = true
  includeSearch: Boolean = true
  includeBatch: Boolean = false
}

type TemplateGenerationResult {
  success: Boolean!
  templates: [GeneratedTemplateInfo!]!
  errors: [String!]!
}

# Batch operation types
input BatchTablePackageExportInput {
  tableIdentifiers: [String!]!
  options: TablePackageExportOptions
  outputDirectory: String
}

type BatchTablePackageExportResult {
  success: Boolean!
  results: [TablePackageExportResult!]!
  exportedCount: Int!
  failedCount: Int!
  outputDirectory: String
  errors: [String!]!
}

input BatchTablePackageImportInput {
  packages: [JSON!]! # JSON representations of TablePackageFormat
  options: TablePackageImportOptions
  createSession: Boolean = true
}

type BatchTablePackageImportResult {
  success: Boolean!
  results: [TablePackageImportResult!]!
  importedCount: Int!
  failedCount: Int!
  session: ImportSession
  errors: [String!]!
}

# Extend root types
extend type Query {
  # Single table export/import operations
  exportTablePackage(
    tableIdentifier: String!
    options: TablePackageExportOptions
  ): TablePackageExportResult!

  # Multiple table operations with dependency resolution
  exportRelatedTablePackages(
    tableIdentifiers: [String!]!
    options: TablePackageExportOptions
  ): [TablePackageExportResult!]!

  # Dependency analysis
  analyzeTableDependencies(tableIdentifier: String!): TableDependencyInfo!
  resolveImportOrder(tableIdentifiers: [String!]!): [String!]!

  # Package validation
  validateTablePackage(
    packageData: JSON! # JSON representation of TablePackageFormat
    options: TablePackageImportOptions
  ): [TablePackageConflict!]!

  # Import session management
  getImportSession(sessionId: ID!): ImportSession
  listImportSessions(status: ImportSessionStatus): [ImportSession!]!

  # Template generation preview
  previewGeneratedTemplates(
    tableIdentifier: String!
    options: TemplateGenerationOptions
  ): TemplateGenerationResult!
}

extend type Mutation {
  # Single table package import
  importTablePackage(
    packageData: JSON! # JSON representation of TablePackageFormat
    options: TablePackageImportOptions
  ): TablePackageImportResult!

  # Multiple table package import with dependency resolution
  importTablePackages(
    packages: [JSON!]! # JSON representations of TablePackageFormat
    options: TablePackageImportOptions
  ): [TablePackageImportResult!]!

  # Batch operations
  batchExportTablePackages(
    input: BatchTablePackageExportInput!
  ): BatchTablePackageExportResult!

  batchImportTablePackages(
    input: BatchTablePackageImportInput!
  ): BatchTablePackageImportResult!

  # Import session management
  createImportSession(
    packages: [JSON!]! # JSON representations of TablePackageFormat
  ): ImportSession!

  rollbackImportSession(sessionId: ID!): ImportSession!

  # Template generation
  generateTableTemplates(
    tableIdentifier: String!
    options: TemplateGenerationOptions
  ): TemplateGenerationResult!

  # File system operations
  exportTablePackageToFile(
    tableIdentifier: String!
    outputPath: String!
    options: TablePackageExportOptions
  ): TablePackageExportResult!

  importTablePackageFromFile(
    filePath: String!
    options: TablePackageImportOptions
  ): TablePackageImportResult!
}