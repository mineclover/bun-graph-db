# Advanced Search Types

enum FilterOperator {
  EQ
  NEQ
  GT
  LT
  GTE
  LTE
  CONTAINS
  STARTS_WITH
  ENDS_WITH
  IN
  NOT_IN
  EXISTS
  NOT_EXISTS
}

enum AggregationOperation {
  COUNT
  SUM
  AVG
  MIN
  MAX
  DISTINCT_COUNT
}

enum SortDirection {
  ASC
  DESC
}

input SearchFilterInput {
  field: String!
  operator: FilterOperator!
  value: JSON
  values: [JSON!]
}

input AdvancedRelationFilterInput {
  relationTypes: [String!]
  direction: RelationDirection
  depth: Int
  targetFilters: [SearchFilterInput!]
}

input AggregationInput {
  field: String!
  operation: AggregationOperation!
  groupBy: [String!]
}

input SortInput {
  field: String!
  direction: SortDirection!
}

input TimeRangeInput {
  startDate: DateTime
  endDate: DateTime
}

input AdvancedSearchInput {
  tableId: String!
  filters: [SearchFilterInput!]
  relationFilters: [AdvancedRelationFilterInput!]
  aggregations: [AggregationInput!]
  sort: [SortInput!]
  limit: Int
  offset: Int
  includeRelationCount: Boolean
  includeAttributes: Boolean
  timeRange: TimeRangeInput
}

# Search Result Types

type SearchResultNode {
  id: String!
  content: String!
  title: String
  tableId: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  relationCount: Int
  attributes: JSON
  score: Float
}

type SearchAggregationResult {
  field: String!
  operation: AggregationOperation!
  value: JSON!
  groupedResults: [SearchGroupedAggregationResult!]
}

type SearchGroupedAggregationResult {
  groupKey: JSON!
  value: JSON!
  count: Int!
}

type AdvancedSearchResult {
  nodes: [SearchResultNode!]!
  aggregations: [SearchAggregationResult!]
  totalCount: Int!
  hasNextPage: Boolean!
  executionTime: Int!
}

# Performance Analysis Types

type QueryPerformance {
  operationType: String!
  averageMs: Float!
  maxMs: Float!
  minMs: Float!
  count: Int!
}

type SearchPerformanceMetrics {
  tableId: String!
  queryResponseTimes: [QueryPerformance!]!
  indexEfficiency: Float!
  cacheHitRatio: Float!
  concurrentOperations: Int!
  averageQueryTime: Float!
  slowestQueries: [SlowQuery!]
}

type SlowQuery {
  queryType: String!
  duration: Float!
  timestamp: DateTime!
  parameters: JSON!
}

input SearchPerformanceAnalysisInput {
  tableId: String!
  timeRange: TimeRangeInput
  includeSlowQueries: Boolean
}

# Monitoring Types

type MonitoringMetrics {
  responseTime: Float!
  throughput: Float!
  errorRate: Float!
  resourceUtilization: Float!
  timestamp: DateTime!
}

type AlertRule {
  id: String!
  name: String!
  condition: String!
  threshold: Float!
  isActive: Boolean!
  createdAt: DateTime!
}

input CreateAlertRuleInput {
  name: String!
  condition: String!
  threshold: Float!
  tableId: String
}

type SystemStatus {
  status: String!
  uptime: Float!
  activeConnections: Int!
  queueLength: Int!
  lastUpdate: DateTime!
}

# Extend root types
extend type Query {
  # Advanced search functionality
  advancedSearch(input: AdvancedSearchInput!): AdvancedSearchResult!
  
  # Performance monitoring
  getSearchPerformanceMetrics(input: SearchPerformanceAnalysisInput!): SearchPerformanceMetrics!
  getMonitoringMetrics(tableId: String!, timeRange: TimeRangeInput): [MonitoringMetrics!]!
  getSystemStatus: SystemStatus!
  
  # Alert management
  getAlertRules(tableId: String): [AlertRule!]!
}

extend type Mutation {
  # Alert management
  createAlertRule(input: CreateAlertRuleInput!): AlertRule!
  updateAlertRule(id: String!, input: CreateAlertRuleInput!): AlertRule!
  deleteAlertRule(id: String!): Boolean!
  
  # System management
  clearCache(tableId: String): Boolean!
  optimizeDatabase: Boolean!
}