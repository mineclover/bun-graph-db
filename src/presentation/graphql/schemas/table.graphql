# Table type definitions based on SQLite schema
type Table {
  id: ID!
  identifier: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!
  
  # Relationships
  attributes: [Attribute!]!
  nodes: [Node!]!
  
  # Computed fields
  nodeCount: Int!
  attributeCount: Int!
}

# Input types for mutations
input CreateTableInput {
  identifier: String!
  description: String
}

input UpdateTableInput {
  description: String
}

# Pagination and filtering
input TablesFilter {
  search: String
  createdAfter: DateTime
  createdBefore: DateTime
}

input TablesPagination {
  limit: Int = 10
  offset: Int = 0
}

# Payload types for mutations
type CreateTablePayload {
  table: Table
  errors: [Error!]!
}

type UpdateTablePayload {
  table: Table
  errors: [Error!]!
}

type DeleteTablePayload {
  success: Boolean!
  errors: [Error!]!
}

# Connection type for pagination
type TablesConnection {
  nodes: [Table!]!
  totalCount: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

extend type Query {
  # Get single table
  table(id: ID!): Table
  tableByIdentifier(identifier: String!): Table
  
  # Get multiple tables
  tables(
    filter: TablesFilter
    pagination: TablesPagination
  ): TablesConnection!
}

extend type Mutation {
  # Table management
  createTable(input: CreateTableInput!): CreateTablePayload!
  updateTable(id: ID!, input: UpdateTableInput!): UpdateTablePayload!
  deleteTable(id: ID!): DeleteTablePayload!
}