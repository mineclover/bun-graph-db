<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Bun Graph DB — Offline-First Platform Workspace</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <graph-memory-workspace
    id="workspace"
    mode="local-headless"
    title="Embedded Browser Knowledge &amp; AI Memory Platform"
    version="1.0.0">
  </graph-memory-workspace>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.12.0/dist/sql-wasm.js"></script>
  <script type="module">
    import { createHeadlessGraphDb, IndexedDbSnapshotStorage } from "/dist/core/index.js";
    import { registerGraphMemoryWorkspace } from "/dist/ui/index.js";

    registerGraphMemoryWorkspace();

    const workspaceEl = document.getElementById("workspace");
    const snapshots = new IndexedDbSnapshotStorage({
      databaseName: "bun-graph-db-web-demo",
    });

    const SQL = await window.initSqlJs({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/sql.js@1.12.0/dist/${file}`,
    });

    let rawSqlDb = new SQL.Database();
    let db = null;

    async function mountDb(sqlDatabase, shouldSeedDefault) {
      db = await createHeadlessGraphDb({
        database: sqlDatabase,
        databaseLabel: "browser:indexeddb",
        snapshotStorage: snapshots,
      });

      if (shouldSeedDefault) {
        const existing = await db.listTables({ limit: 5 });
        if ((existing.data ?? existing.nodes ?? []).length === 0) {
          await db.applyPresetBlueprint("knowledge");
          await db.aiMemory.remember({
            content:
              "Platform UI architecture separates authoring, visualization, and WASM SQLite storage.",
            kind: "semantic",
            topicPath: ["architecture", "ui-platform"],
            importance: 0.92,
          });
          await db.aiMemory.remember({
            content:
              "IndexedDB snapshots persist local WASM SQLite bytes across full page reloads.",
            kind: "procedural",
            topicPath: ["storage", "indexeddb"],
            importance: 0.88,
          });
        }
      }

      workspaceEl.connectHeadlessDb(db, {
        async onSaveSnapshot(key) {
          return await db.saveSnapshot(key);
        },
        async onRestoreSnapshot(key) {
          const obj = await snapshots.getSnapshot(key);
          if (!obj?.data) {
            throw new Error(`No IndexedDB snapshot saved under '${key}' yet.`);
          }
          await db.dispose();
          rawSqlDb = new SQL.Database(obj.data);
          await mountDb(rawSqlDb, false);
          await workspaceEl.refresh();
          const statusEl = workspaceEl.querySelector(".status-message");
          if (statusEl) {
            statusEl.textContent = `Restored IndexedDB snapshot '${key}' (${obj.data.byteLength} bytes).`;
          }
        },
      });
    }

    await mountDb(rawSqlDb, true);
  </script>
</body>
</html>
